<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="css/light.css" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AightBet – Social</title>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#0a0a0f;--surface:rgba(255,255,255,.04);--surface2:rgba(255,255,255,.06);--surface3:rgba(255,255,255,.08);--border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.12);--accent:#8b5cf6;--accent2:#06b6d4;--accent3:#ec4899;--glow:rgba(139,92,246,.45);--glow2:rgba(6,182,212,.35);--text:#e2e8f0;--muted:#94a3b8;--gold:#f59e0b;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--orange:#f97316;--cyan:#22d3ee;--radius:16px;--font:'Segoe UI',system-ui,-apple-system,sans-serif;--nav-h:70px;--nav-h-mobile:64px}
    html{font-size:16px;scroll-behavior:smooth}
    body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden}
    a{color:inherit;text-decoration:none}

    /* ── BG ── */
    .bg-gradient{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 80% 60% at 20% 30%,rgba(139,92,246,.12),transparent),radial-gradient(ellipse 60% 50% at 80% 70%,rgba(6,182,212,.10),transparent),radial-gradient(ellipse 50% 40% at 50% 50%,rgba(236,72,153,.06),transparent);animation:bgShift 14s ease-in-out infinite alternate}
    @keyframes bgShift{0%{transform:scale(1) translate(0,0)}100%{transform:scale(1.08) translate(-2%,1%)}}
    #particles{position:fixed;inset:0;z-index:1;pointer-events:none}
    .grid-overlay{position:fixed;inset:0;z-index:1;background-image:linear-gradient(rgba(255,255,255,.01) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.01) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
    .orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.3;z-index:0;animation:orbFloat 8s ease-in-out infinite alternate}
    .orb-1{width:320px;height:320px;background:var(--accent);top:-80px;left:-60px}
    .orb-2{width:260px;height:260px;background:var(--accent2);bottom:-60px;right:-40px;animation-delay:-3s;animation-duration:10s}
    .orb-3{width:180px;height:180px;background:var(--accent3);top:40%;left:55%;animation-delay:-5s;animation-duration:14s}
    @keyframes orbFloat{0%{transform:translate(0,0) rotate(0deg)}100%{transform:translate(25px,-35px) rotate(4deg)}}

    /* ── NAVBAR ── */
    .navbar{position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:100;display:flex;align-items:center;padding:0 24px;background:rgba(10,10,15,.6);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border-bottom:1px solid var(--border);transition:background .3s}
    .navbar.scrolled{background:rgba(10,10,15,.85)}
    .nav-logo{display:flex;align-items:center;gap:10px;margin-right:auto;cursor:pointer}
    .nav-logo img{width:36px;height:36px;object-fit:contain;border-radius:8px;filter:drop-shadow(0 0 6px rgba(139,92,246,.3))}
    .nav-logo span{font-size:1.25rem;font-weight:800;background:linear-gradient(135deg,#fff 30%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .nav-links{display:flex;align-items:center;gap:4px}
    .nav-link{display:flex;align-items:center;gap:7px;padding:10px 18px;font-size:.9rem;font-weight:600;color:var(--muted);border-radius:10px;transition:color .2s,background .2s;cursor:pointer;border:none;background:transparent;font-family:var(--font)}
    .nav-link:hover,.nav-link.active{color:#fff;background:rgba(255,255,255,.06)}
    .nav-link.active{color:var(--accent);background:rgba(139,92,246,.1)}
    .nav-link svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
    .nav-credits{display:flex;align-items:center;gap:6px;padding:8px 16px;margin-left:12px;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);border-radius:10px;font-size:.85rem;font-weight:700;color:var(--gold);cursor:pointer;transition:background .2s,transform .15s}
    .nav-credits svg{width:16px;height:16px;fill:var(--gold);stroke:none}
    .nav-credits:hover{background:rgba(245,158,11,.18);transform:translateY(-1px)}
    .nav-avatar{width:36px;height:36px;border-radius:50%;margin-left:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;color:#fff;cursor:pointer;border:2px solid rgba(255,255,255,.1);transition:border-color .2s,box-shadow .2s;overflow:hidden;flex-shrink:0}
    .nav-avatar:hover{border-color:var(--accent);box-shadow:0 0 16px -4px var(--glow)}
    .nav-avatar img{width:100%;height:100%;object-fit:cover}
    .hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:8px;margin-left:10px}
    .hamburger span{display:block;width:22px;height:2px;background:var(--text);border-radius:2px;transition:transform .3s,opacity .3s}
    .hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
    .hamburger.open span:nth-child(2){opacity:0}
    .hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
    .mobile-menu{display:none;position:fixed;top:var(--nav-h);left:0;right:0;bottom:0;z-index:99;background:rgba(10,10,15,.95);backdrop-filter:blur(20px);flex-direction:column;padding:24px;gap:8px;animation:fadeSlideDown .3s ease}
    .mobile-menu.open{display:flex}
    @keyframes fadeSlideDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
    .mobile-menu .nav-link{padding:16px 20px;font-size:1.05rem;border-radius:12px}
    .mobile-menu .nav-credits{margin:8px 0 0;padding:14px 20px;font-size:1rem;border-radius:12px;justify-content:center}

    /* ── TOAST ── */
    .toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-120px);padding:12px 24px;border-radius:10px;font-size:.9rem;font-weight:600;z-index:999;transition:transform .4s cubic-bezier(.4,0,.2,1),opacity .4s;opacity:0;pointer-events:none;backdrop-filter:blur(12px);max-width:90vw;text-align:center}
    .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
    .toast.error{background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
    .toast.success{background:rgba(34,197,94,.2);border:1px solid rgba(34,197,94,.3);color:#86efac}

    /* ── MAIN LAYOUT ── */
    .main{position:relative;z-index:10;padding-top:calc(var(--nav-h) + 16px);min-height:100dvh;max-width:1200px;margin:0 auto;display:flex;gap:16px;padding-left:16px;padding-right:16px;padding-bottom:40px}

    /* ── LEFT SIDEBAR ── */
    .sidebar-left{width:260px;flex-shrink:0;position:sticky;top:calc(var(--nav-h) + 16px);height:fit-content;display:flex;flex-direction:column;gap:10px}
    .sidebar-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;backdrop-filter:blur(12px)}
    .sidebar-profile{text-align:center}
    .sidebar-profile .sp-avatar{width:64px;height:64px;border-radius:50%;margin:0 auto 8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:800;color:#fff;border:2px solid var(--border);overflow:hidden}
    .sidebar-profile .sp-avatar img{width:100%;height:100%;object-fit:cover}
    .sidebar-profile .sp-name{font-size:1rem;font-weight:700;margin-bottom:2px}
    .sidebar-profile .sp-handle{font-size:.75rem;color:var(--muted);margin-bottom:10px}
    .sidebar-profile .sp-stats{display:flex;justify-content:center;gap:16px}
    .sidebar-profile .sp-stat{text-align:center}
    .sidebar-profile .sp-stat-num{font-size:.95rem;font-weight:800;color:var(--accent)}
    .sidebar-profile .sp-stat-label{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
    .sidebar-nav{display:flex;flex-direction:column;gap:4px}
    .sidebar-nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;font-size:.85rem;font-weight:600;color:var(--muted);cursor:pointer;transition:all .2s;border:none;background:none;font-family:var(--font);width:100%;text-align:left;position:relative}
    .sidebar-nav-item:hover{color:var(--text);background:var(--surface2)}
    .sidebar-nav-item.active{color:var(--accent);background:rgba(139,92,246,.1)}
    .sidebar-nav-item svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
    .sidebar-nav-item .badge-count{position:absolute;right:10px;background:var(--red);color:#fff;font-size:.55rem;font-weight:800;padding:2px 6px;border-radius:100px;min-width:18px;text-align:center;display:none}
    .sidebar-nav-item .badge-count.show{display:block}

    /* ── CENTER FEED ── */
    .feed-center{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
    #postsContainer{display:flex;flex-direction:column;gap:16px}
    #profilePostsList{display:flex;flex-direction:column;gap:16px}

    /* Feed Tabs */
    .feed-tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:4px}
    .feed-tab{flex:1;padding:10px;font-size:.8rem;font-weight:700;color:var(--muted);background:transparent;border:none;border-radius:8px;cursor:pointer;font-family:var(--font);transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}
    .feed-tab:hover{color:var(--text)}
    .feed-tab.active{color:#fff;background:rgba(139,92,246,.15)}
    .feed-tab svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

    /* Post Composer */
    .composer{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px}
    .composer-top{display:flex;gap:12px;align-items:flex-start}
    .composer-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden;border:2px solid var(--border)}
    .composer-avatar img{width:100%;height:100%;object-fit:cover}
    .composer-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:.9rem;color:var(--text);font-family:var(--font);resize:none;outline:none;min-height:60px;max-height:200px;transition:border-color .2s;line-height:1.5}
    .composer-input:focus{border-color:rgba(139,92,246,.3)}
    .composer-input::placeholder{color:var(--muted)}
    .composer-preview{display:none;position:relative;border-radius:10px;overflow:hidden;max-height:200px}
    .composer-preview.show{display:block}
    .composer-preview img{width:100%;max-height:200px;object-fit:cover;border-radius:10px}
    .composer-preview .remove-img{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.7);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
    .composer-preview .remove-img svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .composer-bottom{display:flex;align-items:center;justify-content:space-between}
    .composer-actions{display:flex;gap:4px}
    .composer-action{padding:8px;border-radius:8px;background:none;border:none;cursor:pointer;color:var(--muted);transition:all .2s;display:flex;align-items:center;justify-content:center}
    .composer-action:hover{color:var(--accent);background:rgba(139,92,246,.1)}
    .composer-action svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .btn-post{padding:8px 24px;font-size:.8rem;font-weight:700;border:none;border-radius:10px;cursor:pointer;font-family:var(--font);color:#fff;background:linear-gradient(135deg,var(--accent),#7c3aed);box-shadow:0 4px 16px -4px var(--glow);transition:all .15s}
    .btn-post:hover{transform:translateY(-1px);box-shadow:0 6px 24px -4px var(--glow)}
    .btn-post:disabled{opacity:.5;cursor:default;transform:none;box-shadow:none}

    /* ── POST CARD ── */
    .post-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color .2s}
    .post-card:hover{border-color:var(--border2)}
    .post-header{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
    .post-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden;cursor:pointer;border:2px solid var(--border)}
    .post-avatar img{width:100%;height:100%;object-fit:cover}
    .post-meta{flex:1;min-width:0}
    .post-author{font-size:.85rem;font-weight:700;cursor:pointer;transition:color .2s}
    .post-author:hover{color:var(--accent)}
    .post-time{font-size:.7rem;color:var(--muted)}
    .post-menu-btn{padding:6px;border-radius:8px;background:none;border:none;cursor:pointer;color:var(--muted);transition:all .2s}
    .post-menu-btn:hover{color:var(--text);background:var(--surface2)}
    .post-menu-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .post-body{padding:10px 16px}
    .post-text{font-size:.9rem;line-height:1.55;word-break:break-word}
    .post-image{width:100%;max-height:400px;object-fit:cover;border-radius:10px;margin-top:10px;cursor:pointer}
    .post-actions{display:flex;align-items:center;gap:2px;padding:8px 12px 12px;border-top:1px solid var(--border);margin-top:8px}
    .post-action-btn{display:flex;align-items:center;gap:5px;padding:8px 12px;border-radius:8px;background:none;border:none;cursor:pointer;font-size:.75rem;font-weight:600;color:var(--muted);font-family:var(--font);transition:all .15s}
    .post-action-btn:hover{color:var(--text);background:var(--surface2)}
    .post-action-btn.liked{color:var(--red)}
    .post-action-btn.liked svg{fill:var(--red);stroke:var(--red)}
    .post-action-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

    /* Comments */
    .post-comments{padding:0 16px 12px}
    .comment-list{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
    .comment-item{display:flex;gap:8px;padding:8px 10px;background:var(--surface2);border-radius:10px}
    .comment-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden;cursor:pointer}
    .comment-avatar img{width:100%;height:100%;object-fit:cover}
    .comment-body{flex:1;min-width:0}
    .comment-author{font-size:.72rem;font-weight:700;cursor:pointer}
    .comment-author:hover{color:var(--accent)}
    .comment-text{font-size:.78rem;color:var(--muted);line-height:1.4;margin-top:1px;word-break:break-word}
    .comment-actions-row{display:flex;gap:8px;margin-top:4px}
    .comment-action{font-size:.6rem;font-weight:600;color:var(--muted);cursor:pointer;background:none;border:none;font-family:var(--font);padding:0;transition:color .2s;display:flex;align-items:center;gap:3px}
    .comment-action:hover{color:var(--accent)}
    .comment-action.liked{color:var(--red)}
    .comment-action svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .comment-action.liked svg{fill:var(--red);stroke:var(--red)}
    .comment-input-row{display:flex;gap:8px;align-items:center}
    .comment-input{flex:1;padding:8px 12px;font-size:.78rem;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font);outline:none;transition:border-color .2s}
    .comment-input:focus{border-color:rgba(139,92,246,.3)}
    .comment-input::placeholder{color:var(--muted)}
    .comment-send{padding:8px;border-radius:8px;background:rgba(139,92,246,.15);border:none;cursor:pointer;color:var(--accent);display:flex;align-items:center;justify-content:center;transition:all .15s}
    .comment-send:hover{background:rgba(139,92,246,.25)}
    .comment-send svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .show-comments-btn{font-size:.72rem;font-weight:600;color:var(--accent);cursor:pointer;background:none;border:none;font-family:var(--font);padding:4px 0;margin-bottom:6px}
    .show-comments-btn:hover{text-decoration:underline}

    /* ── RIGHT SIDEBAR ── */
    .sidebar-right{width:280px;flex-shrink:0;position:sticky;top:calc(var(--nav-h) + 16px);height:fit-content;display:flex;flex-direction:column;gap:10px}
    .suggest-title{font-size:.8rem;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
    .suggest-title svg{width:16px;height:16px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .user-suggest{display:flex;flex-direction:column;gap:8px}
    .user-suggest-item{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;transition:background .2s}
    .user-suggest-item:hover{background:var(--surface2)}
    .us-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden;cursor:pointer}
    .us-avatar img{width:100%;height:100%;object-fit:cover}
    .us-info{flex:1;min-width:0}
    .us-name{font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .us-name:hover{color:var(--accent)}
    .us-handle{font-size:.6rem;color:var(--muted)}
    .btn-follow{padding:6px 14px;font-size:.65rem;font-weight:700;border:1px solid rgba(139,92,246,.3);border-radius:8px;background:rgba(139,92,246,.1);color:var(--accent);cursor:pointer;font-family:var(--font);transition:all .15s;white-space:nowrap}
    .btn-follow:hover{background:rgba(139,92,246,.2)}
    .btn-follow.following{background:var(--surface2);border-color:var(--border);color:var(--muted)}
    .btn-follow.following:hover{border-color:var(--red);color:var(--red);background:rgba(239,68,68,.1)}

    /* ── MESSAGES PANEL ── */
    .messages-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);animation:fadeIn .2s ease}
    .messages-overlay.open{display:flex;align-items:center;justify-content:center}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .messages-panel{width:90vw;max-width:800px;height:80vh;max-height:600px;background:var(--bg);border:1px solid var(--border);border-radius:20px;display:flex;overflow:hidden;animation:slideUp .3s ease}
    @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}

    /* Convo list */
    .msg-sidebar{width:280px;border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
    .msg-sidebar-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
    .msg-sidebar-header h3{font-size:.95rem;font-weight:800}
    .msg-sidebar-close{padding:6px;border-radius:8px;background:none;border:none;cursor:pointer;color:var(--muted)}
    .msg-sidebar-close:hover{color:var(--text);background:var(--surface2)}
    .msg-sidebar-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .msg-search{padding:8px 16px}
    .msg-search input{width:100%;padding:8px 12px;font-size:.78rem;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font);outline:none}
    .msg-search input::placeholder{color:var(--muted)}
    .msg-search input:focus{border-color:rgba(139,92,246,.3)}
    .msg-convos{flex:1;overflow-y:auto;padding:4px 8px}
    .msg-convo{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer;transition:background .2s;position:relative}
    .msg-convo:hover{background:var(--surface2)}
    .msg-convo.active{background:rgba(139,92,246,.1)}
    .msg-convo-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden;position:relative}
    .msg-convo-avatar img{width:100%;height:100%;object-fit:cover}
    .msg-convo-info{flex:1;min-width:0}
    .msg-convo-name{font-size:.8rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .msg-convo-last{font-size:.65rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .msg-convo-time{font-size:.55rem;color:var(--muted);position:absolute;top:10px;right:10px}
    .msg-convo-unread{position:absolute;bottom:10px;right:10px;background:var(--red);color:#fff;font-size:.5rem;font-weight:800;padding:2px 6px;border-radius:100px;min-width:16px;text-align:center;display:none}
    .msg-convo-unread.show{display:block}

    /* Chat area */
    .msg-chat{flex:1;display:flex;flex-direction:column}
    .msg-chat-header{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
    .msg-chat-back{display:none;padding:6px;border-radius:8px;background:none;border:none;cursor:pointer;color:var(--muted)}
    .msg-chat-back svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .msg-chat-name{font-size:.85rem;font-weight:700}
    .msg-chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
    .msg-bubble{max-width:75%;padding:10px 14px;border-radius:14px;font-size:.82rem;line-height:1.45;word-break:break-word}
    .msg-bubble.sent{align-self:flex-end;background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;border-bottom-right-radius:4px}
    .msg-bubble.received{align-self:flex-start;background:var(--surface2);color:var(--text);border-bottom-left-radius:4px}
    .msg-bubble .msg-ts{font-size:.5rem;color:rgba(255,255,255,.5);margin-top:4px;text-align:right}
    .msg-bubble.received .msg-ts{color:var(--muted)}
    .msg-chat-input{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center}
    .msg-chat-input input{flex:1;padding:10px 14px;font-size:.82rem;background:var(--surface2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--font);outline:none}
    .msg-chat-input input::placeholder{color:var(--muted)}
    .msg-chat-input input:focus{border-color:rgba(139,92,246,.3)}
    .msg-send-btn{padding:10px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#7c3aed);border:none;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;transition:all .15s}
    .msg-send-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px -2px var(--glow)}
    .msg-send-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .msg-empty{display:flex;align-items:center;justify-content:center;flex:1;color:var(--muted);font-size:.85rem;text-align:center;padding:20px}
    .msg-new-convo-btn{margin:8px;padding:10px;border-radius:10px;background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.2);color:var(--accent);font-size:.78rem;font-weight:700;cursor:pointer;font-family:var(--font);text-align:center;transition:all .15s}
    .msg-new-convo-btn:hover{background:rgba(139,92,246,.2)}

    /* ── USER PROFILE OVERLAY ── */
    .profile-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);overflow-y:auto;padding:40px 20px}
    .profile-overlay.open{display:block}
   .profile-panel{max-width:720px;margin:0 auto;background:var(--bg);border:1px solid var(--border);border-radius:20px;overflow:hidden;animation:slideUp .3s ease}
   .profile-banner{width:100%;height:280px;position:relative;overflow:hidden}
    .profile-banner canvas{width:100%;height:100%;display:block}
    .profile-banner .pb-gradient{position:absolute;bottom:0;left:0;right:0;height:80px;background:linear-gradient(transparent,var(--bg))}
    .profile-info{padding:0 24px 20px;position:relative}
   .profile-avatar-wrap{width:88px;height:88px;border-radius:50%;border:4px solid var(--bg);margin-top:-44px;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:800;color:#fff;box-shadow:0 4px 20px rgba(0,0,0,.4)}
    .profile-avatar-wrap img{width:100%;height:100%;object-fit:cover}
    .profile-top-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
    .profile-name-col{flex:1}
    .profile-nickname{font-size:1.2rem;font-weight:800;margin-top:8px}
    .profile-handle{font-size:.75rem;color:var(--muted)}
    .profile-bio{font-size:.82rem;color:var(--muted);line-height:1.5;margin:8px 0 14px}
    .profile-stats-row{display:flex;gap:20px;margin-bottom:16px}
    .profile-stat{text-align:center}
    .profile-stat-num{font-size:1rem;font-weight:800;color:var(--accent)}
    .profile-stat-label{font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
    .profile-actions-row{display:flex;gap:8px;margin-bottom:16px}
    .profile-btn{padding:8px 20px;font-size:.78rem;font-weight:700;border-radius:10px;cursor:pointer;font-family:var(--font);transition:all .15s;border:1px solid var(--border)}
    .profile-btn-primary{background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;border:none}
    .profile-btn-primary:hover{transform:translateY(-1px)}
    .profile-btn-secondary{background:var(--surface);color:var(--text)}
    .profile-btn-secondary:hover{background:var(--surface2)}
  .profile-btn-danger{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#f87171;display:flex;align-items:center;gap:6px;padding:10px 18px}
.profile-btn-danger svg{width:16px;height:16px;stroke:#f87171;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.profile-btn-danger:hover{background:rgba(239,68,68,.2)}
    .profile-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.5);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5}
    .profile-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .profile-posts-section{padding:0 24px 24px}
    .profile-posts-title{font-size:.85rem;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
    .profile-posts-title svg{width:16px;height:16px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .profile-private-msg{text-align:center;padding:40px 20px;color:var(--muted);font-size:.85rem}
    .profile-private-msg svg{width:40px;height:40px;stroke:var(--muted);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin-bottom:10px;display:block;margin:0 auto 10px}

    /* ── SETTINGS OVERLAY ── */
    .settings-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);overflow-y:auto;padding:40px 20px}
    .settings-overlay.open{display:block}
    .settings-panel{max-width:480px;margin:0 auto;background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:24px;animation:slideUp .3s ease}
    .settings-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    .settings-header h2{font-size:1.1rem;font-weight:800}
    .settings-close{padding:6px;border-radius:8px;background:none;border:none;cursor:pointer;color:var(--muted)}
    .settings-close:hover{color:var(--text)}
    .settings-close svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .settings-section{margin-bottom:20px}
    .settings-section h3{font-size:.85rem;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
    .settings-section h3 svg{width:16px;height:16px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .setting-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
    .setting-label{font-size:.82rem;font-weight:600}
    .setting-desc{font-size:.65rem;color:var(--muted)}
    .toggle-switch{position:relative;width:40px;height:22px;flex-shrink:0}
    .toggle-switch input{opacity:0;width:0;height:0}
    .toggle-slider{position:absolute;inset:0;background:var(--surface3);border-radius:22px;cursor:pointer;transition:background .2s}
    .toggle-slider::before{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .2s}
    .toggle-switch input:checked+.toggle-slider{background:var(--accent)}
    .toggle-switch input:checked+.toggle-slider::before{transform:translateX(18px)}
    .settings-input{width:100%;padding:10px 14px;font-size:.82rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--font);outline:none;margin-bottom:8px}
    .settings-input:focus{border-color:rgba(139,92,246,.3)}
    .settings-save{padding:10px 24px;font-size:.82rem;font-weight:700;border:none;border-radius:10px;cursor:pointer;font-family:var(--font);color:#fff;background:linear-gradient(135deg,var(--accent),#7c3aed);transition:all .15s}
    .settings-save:hover{transform:translateY(-1px)}

    /* Report Modal */
    .report-overlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.7);backdrop-filter:blur(6px)}
    .report-overlay.open{display:flex;align-items:center;justify-content:center}
    .report-modal{background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:24px;width:90vw;max-width:400px;animation:slideUp .3s ease}
    .report-modal h3{font-size:1rem;font-weight:800;margin-bottom:12px}
    .report-options{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
    .report-option{padding:10px 14px;font-size:.82rem;font-weight:600;background:var(--surface);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s;font-family:var(--font);color:var(--text);text-align:left}
    .report-option:hover{border-color:var(--red);color:var(--red);background:rgba(239,68,68,.05)}
    .report-option.selected{border-color:var(--red);background:rgba(239,68,68,.1);color:var(--red)}
    .report-btns{display:flex;gap:8px;justify-content:flex-end}
    .report-cancel{padding:8px 18px;font-size:.78rem;font-weight:700;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--muted);cursor:pointer;font-family:var(--font)}
    .report-submit{padding:8px 18px;font-size:.78rem;font-weight:700;border:none;border-radius:8px;background:var(--red);color:#fff;cursor:pointer;font-family:var(--font)}
    .report-submit:disabled{opacity:.4;cursor:default}

    /* Loading */
    .loader{display:flex;justify-content:center;padding:30px}
    .loader-spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Post dropdown */
    .post-dropdown{position:absolute;top:100%;right:0;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:4px;min-width:140px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none}
    .post-dropdown.open{display:block}
    .post-dropdown-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:6px;font-size:.75rem;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s;border:none;background:none;width:100%;font-family:var(--font);text-align:left}
    .post-dropdown-item:hover{color:var(--text);background:var(--surface2)}
    .post-dropdown-item.danger{color:var(--red)}
    .post-dropdown-item.danger:hover{background:rgba(239,68,68,.1)}
    .post-dropdown-item svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

    /* ── FOOTER ── */
    .footer{position:relative;z-index:10;text-align:center;padding:32px 24px;border-top:1px solid var(--border);color:var(--muted);font-size:.8rem;max-width:1200px;margin:0 auto}

    /* Image input hidden */
    #imageInput{display:none}

    /* New convo search modal */
    .new-convo-overlay{display:none;position:fixed;inset:0;z-index:250;background:rgba(0,0,0,.6)}
    .new-convo-overlay.open{display:flex;align-items:center;justify-content:center}
    .new-convo-modal{background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:20px;width:90vw;max-width:360px;animation:slideUp .3s ease}
    .new-convo-modal h3{font-size:.95rem;font-weight:800;margin-bottom:12px}
    .new-convo-search{width:100%;padding:10px 14px;font-size:.82rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--font);outline:none;margin-bottom:10px}
    .new-convo-search:focus{border-color:rgba(139,92,246,.3)}
    .new-convo-results{max-height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
    .new-convo-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer;transition:background .2s}
    .new-convo-user:hover{background:var(--surface2)}
    .new-convo-user .ncu-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden}
    .new-convo-user .ncu-av img{width:100%;height:100%;object-fit:cover}
    .new-convo-user .ncu-name{font-size:.82rem;font-weight:700}

    /* ── RESPONSIVE ── */
    @media(max-width:1024px){
      .sidebar-right{display:none}
    }
    @media(max-width:768px){
      .nav-links,.nav-credits-desktop{display:none!important}
      .hamburger{display:flex}
      .navbar{height:var(--nav-h-mobile);padding:0 16px}
      .main{padding-top:calc(var(--nav-h-mobile) + 10px);flex-direction:column}
      .sidebar-left{width:100%;position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
      .sidebar-left .sidebar-card.sidebar-profile{display:none}
      .sidebar-left .sidebar-card:has(.sidebar-nav){padding:8px}
      .sidebar-nav{flex-direction:row}
      .sidebar-nav-item{padding:8px 12px;white-space:nowrap;font-size:.75rem}
      .mobile-menu{top:var(--nav-h-mobile)}
      .msg-sidebar{width:100%}
      .msg-panel-mobile-full .msg-sidebar{display:none}
      .msg-panel-mobile-full .msg-chat{display:flex}
      .msg-chat-back{display:flex!important}
      .messages-panel{width:95vw;height:90vh}
    }
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>

  function timeAgo(ts){const d=Date.now()-ts;if(d<60000)return 'just now';if(d<3600000)return Math.floor(d/60000)+'m';if(d<86400000)return Math.floor(d/3600000)+'h';if(d<604800000)return Math.floor(d/86400000)+'d';return new Date(ts).toLocaleDateString();}

  /* ══════════════════════════════════════════
     USER DATA HELPERS
  ══════════════════════════════════════════ */
  function getUserData(uid){return allUsersCache[uid]||{};}

  function getUserName(uid){
    const d=allUsersCache[uid]||{};
    if(d.nickname&&typeof d.nickname==='string'&&d.nickname.trim().length>0)return d.nickname.trim();
    if(uid===MY_UID){
      if(UD.nickname&&typeof UD.nickname==='string'&&UD.nickname.trim().length>0)return UD.nickname.trim();
      if(CU&&CU.displayName)return CU.displayName;
      if(CU&&CU.email)return CU.email.split('@')[0];
    }
    if(d.displayName&&typeof d.displayName==='string'&&d.displayName.trim().length>0)return d.displayName.trim();
    if(d.email){const local=d.email.split('@')[0];if(local)return local;}
    return 'User_'+uid.substring(0,6);
  }

  function getUserAvatar(uid){
    const d=allUsersCache[uid]||{};
    if(d.avatar&&typeof d.avatar==='string'&&d.avatar.trim())return d.avatar.trim();
    if(d.photoURL&&typeof d.photoURL==='string'&&d.photoURL.trim())return d.photoURL.trim();
    if(uid===MY_UID){
      if(UD.avatar)return UD.avatar;
      if(UD.photoURL)return UD.photoURL;
      if(CU&&CU.photoURL)return CU.photoURL;
    }
    return null;
  }

  function getUserHandle(uid){return '@'+getUserName(uid).toLowerCase().replace(/\s+/g,'');}

  function avatarHTML(uid,cls,sz){
    const url=getUserAvatar(uid);
    const name=getUserName(uid);
    const style=sz?`style="width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.4)}px"`:'';
    if(url)return`<div class="${cls}" ${style}><img src="${url}" alt=""/></div>`;
    return`<div class="${cls}" ${style}>${name[0].toUpperCase()}</div>`;
  }

  /* ══════════════════════════════════════════
     FOLLOW SYSTEM
  ══════════════════════════════════════════ */
  function isFollowing(uid){
    if(UD.social&&UD.social.following&&UD.social.following[uid]===true)return true;
    const d=allUsersCache[MY_UID]||{};
    if(d.social&&d.social.following&&d.social.following[uid]===true)return true;
    return false;
  }

  function areFriends(uid){
    if(uid===MY_UID)return false;
    const iFollow=isFollowing(uid);
    const theyData=allUsersCache[uid]||{};
    const theyFollowMe=theyData.social&&theyData.social.following&&theyData.social.following[MY_UID]===true;
    return iFollow&&!!theyFollowMe;
  }

  async function toggleFollow(uid){
    if(uid===MY_UID)return;
    const ref=rtdb.ref('users/'+MY_UID+'/social/following/'+uid);
    if(isFollowing(uid)){await ref.remove();toast('Unfollowed','success');}
    else{await ref.set(true);toast('Followed!','success');}
  }

  /* ══════════════════════════════════════════
     SIDEBAR STATS
  ══════════════════════════════════════════ */
  function updateSidebarStats(){
    const myFollowing=(UD.social&&UD.social.following)?Object.keys(UD.social.following).length:0;
    let myFollowers=0;
    Object.entries(allUsersCache).forEach(([uid,d])=>{
      if(uid===MY_UID)return;
      if(d.social&&d.social.following&&d.social.following[MY_UID]===true)myFollowers++;
    });
    document.getElementById('spFollowers').textContent=myFollowers;
    document.getElementById('spFollowing').textContent=myFollowing;
    rtdb.ref('posts').orderByChild('authorUid').equalTo(MY_UID).once('value',snap=>{
      document.getElementById('spPosts').textContent=snap.numChildren();
    });
  }

  /* ══════════════════════════════════════════
     AUTH STATE
  ══════════════════════════════════════════ */
  auth.onAuthStateChanged(u=>{
    if(!u){location.href='index.html';return;}
    CU=u;MY_UID=u.uid;

    rtdb.ref('users/'+u.uid).on('value',snap=>{
      UD=snap.val()||{};
      const c=(UD.credits||0).toLocaleString();
      document.getElementById('creditsCount').textContent=c;
      document.getElementById('creditsCountMobile').textContent=c;

      const av=document.getElementById('navAvatar');
      const url=UD.avatar||u.photoURL;
      if(url)av.innerHTML=`<img src="${url}" alt=""/>`;
      else av.textContent=(UD.nickname||u.displayName||u.email||'?')[0].toUpperCase();

      const spAv=document.getElementById('spAvatar');
      if(url)spAv.innerHTML=`<img src="${url}" alt=""/>`;
      else spAv.textContent=(UD.nickname||u.displayName||'?')[0].toUpperCase();

      const myName=UD.nickname||u.displayName||(u.email&&u.email.split('@')[0])||'Player';
      document.getElementById('spName').textContent=myName;
      document.getElementById('spHandle').textContent='@'+myName.toLowerCase().replace(/\s+/g,'');

      const cAv=document.getElementById('composerAvatar');
      if(url)cAv.innerHTML=`<img src="${url}" alt=""/>`;
      else cAv.textContent=myName[0].toUpperCase();

      document.getElementById('settingPrivate').checked=!!UD.privateProfile;
      document.getElementById('settingBio').value=UD.bio||'';
      document.getElementById('settingNickname').value=UD.nickname||u.displayName||'';

      updateSidebarStats();
    });

    loadAllUsers();
    loadPosts();
    listenMessages();
  });

  /* ══════════════════════════════════════════
     LOAD ALL USERS
  ══════════════════════════════════════════ */
  function loadAllUsers(){
    rtdb.ref('users').on('value',snap=>{
      allUsersCache=snap.val()||{};
      renderSuggestions();
      updateSidebarStats();
      rtdb.ref('posts').orderByChild('timestamp').once('value',psnap=>{
        const posts=[];
        psnap.forEach(child=>{posts.push({id:child.key,...child.val()});});
        posts.reverse();
        renderPosts(posts);
      });
    });
  }

  /* ══════════════════════════════════════════
     SUGGESTIONS
  ══════════════════════════════════════════ */
  function renderSuggestions(){
    const c=document.getElementById('userSuggest');c.innerHTML='';
    const uids=Object.keys(allUsersCache).filter(uid=>uid!==MY_UID);
    const shuffled=uids.sort(()=>Math.random()-.5).slice(0,5);
    shuffled.forEach(uid=>{
      const name=getUserName(uid);
      const fol=isFollowing(uid);
      const av=getUserAvatar(uid);
      const item=document.createElement('div');item.className='user-suggest-item';
      item.innerHTML=`
        <div class="us-avatar">${av?`<img src="${av}" alt=""/>`:name[0].toUpperCase()}</div>
        <div class="us-info">
          <div class="us-name" data-uid="${uid}">${name}</div>
          <div class="us-handle">${getUserHandle(uid)}</div>
        </div>
        <button class="btn-follow ${fol?'following':''}" data-uid="${uid}">${fol?'Following':'Follow'}</button>
      `;
      item.querySelector('.us-name').addEventListener('click',()=>openProfile(uid));
      item.querySelector('.btn-follow').addEventListener('click',async e=>{
        await toggleFollow(uid);
        e.target.classList.toggle('following');
        e.target.textContent=isFollowing(uid)?'Following':'Follow';
      });
      c.appendChild(item);
    });
  }

  /* ══════════════════════════════════════════
     POSTS — CREATE
  ══════════════════════════════════════════ */
  const composerInput=document.getElementById('composerInput');
  const postBtn=document.getElementById('postBtn');
  const imageInput=document.getElementById('imageInput');
  const composerPreview=document.getElementById('composerPreview');
  const previewImg=document.getElementById('previewImg');

  composerInput.addEventListener('input',()=>{
    postBtn.disabled=!composerInput.value.trim()&&!pendingImageData;
    composerInput.style.height='auto';
    composerInput.style.height=composerInput.scrollHeight+'px';
  });

  document.getElementById('addImageBtn').addEventListener('click',()=>imageInput.click());

  imageInput.addEventListener('change',e=>{
    const file=e.target.files[0];if(!file)return;
    if(file.size>2*1024*1024){toast('Image must be under 2MB');return;}
    const reader=new FileReader();
    reader.onload=ev=>{
      pendingImageData=ev.target.result;
      previewImg.src=pendingImageData;
      composerPreview.classList.add('show');
      postBtn.disabled=false;
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('removeImg').addEventListener('click',()=>{
    pendingImageData=null;
    composerPreview.classList.remove('show');
    imageInput.value='';
    postBtn.disabled=!composerInput.value.trim();
  });

  postBtn.addEventListener('click',async()=>{
    const text=composerInput.value.trim();
    if(!text&&!pendingImageData)return;
    postBtn.disabled=true;
    try{
      const myName=(UD.nickname&&UD.nickname.trim())||(CU.displayName)||(CU.email&&CU.email.split('@')[0])||'Player';
      const myAvatar=UD.avatar||CU.photoURL||null;
      const post={
        authorUid:MY_UID,
        authorName:myName,
        authorAvatar:myAvatar,
        text:text,
        image:pendingImageData||null,
        timestamp:firebase.database.ServerValue.TIMESTAMP,
        likes:{},
        comments:{}
      };
      await rtdb.ref('posts').push(post);
      composerInput.value='';composerInput.style.height='auto';
      pendingImageData=null;composerPreview.classList.remove('show');imageInput.value='';
      toast('Posted!','success');
    }catch(e){toast('Failed: '+e.message);}
    postBtn.disabled=false;
  });

  /* ══════════════════════════════════════════
     POSTS — LOAD & RENDER
  ══════════════════════════════════════════ */
  function loadPosts(){
    document.getElementById('feedLoader').style.display='flex';
    rtdb.ref('posts').orderByChild('timestamp').on('value',snap=>{
      document.getElementById('feedLoader').style.display='none';
      const posts=[];
      snap.forEach(child=>{posts.push({id:child.key,...child.val()});});
      posts.reverse();
      renderPosts(posts);
    });
  }

  function renderPosts(posts){
    const container=document.getElementById('postsContainer');
    container.innerHTML='';
    const myFollowing=(UD.social&&UD.social.following)||{};

    const filtered=posts.filter(p=>{
      const authorData=getUserData(p.authorUid);
      if(authorData.privateProfile&&p.authorUid!==MY_UID&&!areFriends(p.authorUid))return false;
      if(activeFeed==='friends'){
        if(p.authorUid===MY_UID)return true;
        return areFriends(p.authorUid);
      }
      return true;
    });

    filtered.forEach(post=>{
      container.appendChild(createPostCard(post));
    });

    if(!container.children.length){
      container.innerHTML=`<div style="text-align:center;padding:60px 20px;color:var(--muted)">
        <svg viewBox="0 0 24 24" style="width:48px;height:48px;stroke:var(--muted);fill:none;stroke-width:1.5;margin:0 auto 12px;display:block"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        <div style="font-weight:700;margin-bottom:4px">No posts yet</div>
        <div style="font-size:.8rem">${activeFeed==='friends'?'Follow some people and they follow you back to see their posts here!':'Be the first to post something!'}</div>
      </div>`;
    }
  }

  /* ══════════════════════════════════════════
     POST CARD
  ══════════════════════════════════════════ */
  function createPostCard(post){
    const card=document.createElement('div');card.className='post-card';card.dataset.postId=post.id;
    const liked=post.likes&&post.likes[MY_UID];
    const likeCount=post.likes?Object.keys(post.likes).length:0;
    const commentsObj=post.comments||{};
    const commentEntries=Object.entries(commentsObj);
    const commentCount=commentEntries.length;
    const isAuthor=post.authorUid===MY_UID;

    const authorName=(()=>{
      const cached=getUserName(post.authorUid);
      if(!cached.startsWith('User_'))return cached;
      return post.authorName||cached;
    })();
    const authorAv=getUserAvatar(post.authorUid)||post.authorAvatar||null;

    const postAvHTML=authorAv
      ?`<div class="post-avatar" data-uid="${post.authorUid}"><img src="${authorAv}" alt=""/></div>`
      :`<div class="post-avatar" data-uid="${post.authorUid}">${authorName[0].toUpperCase()}</div>`;

    card.innerHTML=`
      <div class="post-header">
        ${postAvHTML}
        <div class="post-meta">
          <div class="post-author" data-uid="${post.authorUid}">${authorName}</div>
          <div class="post-time">${timeAgo(post.timestamp)}</div>
        </div>
        <div style="position:relative">
          <button class="post-menu-btn">${ICONS.more}</button>
          <div class="post-dropdown">
            ${isAuthor?`<button class="post-dropdown-item danger" data-act="delete">${ICONS.trash} Delete Post</button>`:''}
            ${!isAuthor?`<button class="post-dropdown-item danger" data-act="report">${ICONS.flag} Report Post</button>`:''}
          </div>
        </div>
      </div>
      <div class="post-body">
        ${post.text?`<div class="post-text">${escapeHTML(post.text)}</div>`:''}
        ${post.image?`<img class="post-image" src="${post.image}" alt="Post image" />`:''}
      </div>
      <div class="post-actions">
        <button class="post-action-btn ${liked?'liked':''}" data-act="like">
          ${ICONS.heart}
          <span class="like-count">${likeCount||''}</span>
        </button>
        <button class="post-action-btn" data-act="comment">
          ${ICONS.comment}
          <span class="comment-count">${commentCount||''}</span>
        </button>
        <button class="post-action-btn" data-act="share">
          ${ICONS.share}
          <span>Share</span>
        </button>
      </div>
      <div class="post-comments" style="display:none">
        ${commentCount>0?`<button class="show-comments-btn">View ${commentCount} comment${commentCount>1?'s':''}</button>`:''}
        <div class="comment-list" style="display:none"></div>
        <div class="comment-input-row">
          <input class="comment-input" placeholder="Write a comment..." maxlength="300" />
          <button class="comment-send">${ICONS.send}</button>
        </div>
      </div>
    `;

    // Author click
    card.querySelector('.post-avatar').addEventListener('click',()=>openProfile(post.authorUid));
    card.querySelector('.post-author').addEventListener('click',()=>openProfile(post.authorUid));

    // Dropdown
    const menuBtn=card.querySelector('.post-menu-btn');
    const dropdown=card.querySelector('.post-dropdown');
    menuBtn.addEventListener('click',e=>{
      e.stopPropagation();
      document.querySelectorAll('.post-dropdown.open').forEach(d=>{if(d!==dropdown)d.classList.remove('open');});
      dropdown.classList.toggle('open');
    });
    const deleteBtn=card.querySelector('[data-act="delete"]');
    if(deleteBtn)deleteBtn.addEventListener('click',()=>{
      if(confirm('Delete this post?'))rtdb.ref('posts/'+post.id).remove().then(()=>toast('Deleted','success'));
      dropdown.classList.remove('open');
    });
    const reportBtn=card.querySelector('[data-act="report"]');
    if(reportBtn)reportBtn.addEventListener('click',()=>{
      reportTarget={type:'post',id:post.id,authorUid:post.authorUid};
      openReport();dropdown.classList.remove('open');
    });

    // Like
    card.querySelector('[data-act="like"]').addEventListener('click',async()=>{
      const ref=rtdb.ref('posts/'+post.id+'/likes/'+MY_UID);
      if(post.likes&&post.likes[MY_UID])await ref.remove();
      else await ref.set(true);
    });

    // Share
    card.querySelector('[data-act="share"]').addEventListener('click',()=>{
      const url=window.location.origin+window.location.pathname+'?post='+post.id;
      navigator.clipboard.writeText(url).then(()=>toast('Link copied!','success')).catch(()=>{
        const ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
        toast('Link copied!','success');
      });
    });

    // Comments
    const commentsSection=card.querySelector('.post-comments');
    const commentListEl=card.querySelector('.comment-list');
    const showBtn=card.querySelector('.show-comments-btn');

    card.querySelector('[data-act="comment"]').addEventListener('click',()=>{
      commentsSection.style.display=commentsSection.style.display==='none'?'block':'none';
      if(commentsSection.style.display==='block'&&commentCount>0&&!commentListEl.children.length){
        commentListEl.style.display='flex';
        if(showBtn)showBtn.style.display='none';
        renderCommentsLive(commentListEl,post.id);
      }
    });

    if(showBtn){
      showBtn.addEventListener('click',()=>{
        const showing=commentListEl.style.display==='flex';
        commentListEl.style.display=showing?'none':'flex';
        showBtn.textContent=showing?`View ${commentCount} comment${commentCount>1?'s':''}`:'Hide comments';
        if(!showing&&!commentListEl.children.length)renderCommentsLive(commentListEl,post.id);
      });
    }

    // Send comment
    const commentInput=card.querySelector('.comment-input');
    const commentSend=card.querySelector('.comment-send');
    const doSendComment=async()=>{
      const text=commentInput.value.trim();if(!text)return;
      commentInput.value='';
      await rtdb.ref('posts/'+post.id+'/comments').push({
        authorUid:MY_UID,text:text,timestamp:firebase.database.ServerValue.TIMESTAMP,likes:{}
      });
      commentsSection.style.display='block';
      commentListEl.style.display='flex';
      if(showBtn)showBtn.style.display='none';
      if(!commentListEl.dataset.listening)renderCommentsLive(commentListEl,post.id);
    };
    commentSend.addEventListener('click',doSendComment);
    commentInput.addEventListener('keydown',e=>{if(e.key==='Enter')doSendComment();});

    return card;
  }

  // Close dropdowns on outside click
  document.addEventListener('click',()=>{document.querySelectorAll('.post-dropdown.open').forEach(d=>d.classList.remove('open'));});

  /* ══════════════════════════════════════════
     COMMENTS — LIVE
  ══════════════════════════════════════════ */
  function renderCommentsLive(container,postId){
    container.dataset.listening='true';
    rtdb.ref('posts/'+postId+'/comments').orderByChild('timestamp').on('value',snap=>{
      container.innerHTML='';
      snap.forEach(child=>{
        const c=child.val();
        const cId=child.key;
        const cLiked=c.likes&&c.likes[MY_UID];
        const cLikeCount=c.likes?Object.keys(c.likes).length:0;
        const cName=getUserName(c.authorUid);
        const cAv=getUserAvatar(c.authorUid);
        const isMyComment=c.authorUid===MY_UID;

        const avHTML=cAv
          ?`<div class="comment-avatar" data-uid="${c.authorUid}"><img src="${cAv}" alt=""/></div>`
          :`<div class="comment-avatar" data-uid="${c.authorUid}">${cName[0].toUpperCase()}</div>`;

        const item=document.createElement('div');item.className='comment-item';
        item.innerHTML=`
          ${avHTML}
          <div class="comment-body">
            <div class="comment-author" data-uid="${c.authorUid}">${cName}</div>
            <div class="comment-text">${escapeHTML(c.text)}</div>
            <div class="comment-actions-row">
              <button class="comment-action ${cLiked?'liked':''}" data-act="likeComment">
                ${ICONS.heart} <span>${cLikeCount||''}</span>
              </button>
              <button class="comment-action" data-act="replyComment">
                ${ICONS.reply} Reply
              </button>
              ${!isMyComment?`<button class="comment-action" data-act="reportComment">${ICONS.flag}</button>`:''}
              ${isMyComment?`<button class="comment-action" data-act="deleteComment" style="color:var(--red)">${ICONS.trash}</button>`:''}
            </div>
          </div>
        `;

        item.querySelector('.comment-avatar').addEventListener('click',()=>openProfile(c.authorUid));
        item.querySelector('.comment-author').addEventListener('click',()=>openProfile(c.authorUid));

        item.querySelector('[data-act="likeComment"]').addEventListener('click',async()=>{
          const ref=rtdb.ref('posts/'+postId+'/comments/'+cId+'/likes/'+MY_UID);
          if(cLiked)await ref.remove();else await ref.set(true);
        });

        item.querySelector('[data-act="replyComment"]').addEventListener('click',()=>{
          const card=container.closest('.post-card');
          if(!card)return;
          const input=card.querySelector('.comment-input');
          input.value='@'+cName+' ';
          input.focus();
        });

        const repBtn=item.querySelector('[data-act="reportComment"]');
        if(repBtn){
          repBtn.addEventListener('click',()=>{
            reportTarget={type:'comment',id:cId,postId:postId,authorUid:c.authorUid};
            openReport();
          });
        }

        const delBtn=item.querySelector('[data-act="deleteComment"]');
        if(delBtn){
          delBtn.addEventListener('click',()=>{
            if(confirm('Delete this comment?'))rtdb.ref('posts/'+postId+'/comments/'+cId).remove().then(()=>toast('Comment deleted','success'));
          });
        }

        container.appendChild(item);
      });
    });
  }

  /* ══════════════════════════════════════════
     MESSAGES SYSTEM
  ══════════════════════════════════════════ */
  function listenMessages(){
    rtdb.ref('conversations').on('value',snap=>{
      convosData={};
      let totalUnread=0;
      snap.forEach(child=>{
        const d=child.val();
        if(!d.participants||!d.participants[MY_UID])return;
        d._id=child.key;
        convosData[child.key]=d;
        const unread=(d.unreadCount&&d.unreadCount[MY_UID])||0;
        totalUnread+=unread;
      });
      const badge=document.getElementById('msgBadge');
      if(totalUnread>0){badge.textContent=totalUnread;badge.classList.add('show');}
      else{badge.classList.remove('show');}
      if(document.getElementById('messagesOverlay').classList.contains('open'))renderConvoList();
    });
  }

  function openMessages(){
    document.getElementById('messagesOverlay').classList.add('open');
    renderConvoList();
  }

  document.getElementById('msgClose').addEventListener('click',()=>{
    document.getElementById('messagesOverlay').classList.remove('open');
    activeConvoId=null;
  });

  document.getElementById('messagesOverlay').addEventListener('click',e=>{
    if(e.target===e.currentTarget){e.currentTarget.classList.remove('open');activeConvoId=null;}
  });

  function renderConvoList(){
    const c=document.getElementById('msgConvos');c.innerHTML='';
    const list=Object.values(convosData).sort((a,b)=>(b.lastMessageTs||0)-(a.lastMessageTs||0));
    const search=(document.getElementById('msgSearchInput').value||'').toLowerCase();

    if(!list.length){
      c.innerHTML=`<div style="text-align:center;padding:30px 16px;color:var(--muted);font-size:.8rem">No conversations yet. Start one!</div>`;
      return;
    }

    list.forEach(convo=>{
      const otherUid=Object.keys(convo.participants||{}).find(uid=>uid!==MY_UID);
      if(!otherUid)return;
      const name=getUserName(otherUid);
      if(search&&!name.toLowerCase().includes(search))return;
      const unread=(convo.unreadCount&&convo.unreadCount[MY_UID])||0;
      const av=getUserAvatar(otherUid);

      const item=document.createElement('div');
      item.className='msg-convo'+(activeConvoId===convo._id?' active':'');
      item.innerHTML=`
        <div class="msg-convo-avatar">${av?`<img src="${av}" alt=""/>`:name[0].toUpperCase()}</div>
        <div class="msg-convo-info">
          <div class="msg-convo-name">${name}</div>
          <div class="msg-convo-last">${convo.lastMessage||'No messages yet'}</div>
        </div>
        <div class="msg-convo-time">${convo.lastMessageTs?timeAgo(convo.lastMessageTs):''}</div>
        <div class="msg-convo-unread ${unread>0?'show':''}">${unread}</div>
      `;
      item.addEventListener('click',()=>openConvo(convo._id,otherUid));
      c.appendChild(item);
    });
  }

  function openConvo(convoId,otherUid){
    activeConvoId=convoId;
    document.getElementById('messagesPanel').classList.add('msg-panel-mobile-full');
    document.getElementById('msgEmpty').style.display='none';
    document.getElementById('msgChatHeader').style.display='flex';
    document.getElementById('msgChatBody').style.display='flex';
    document.getElementById('msgChatBody').innerHTML='';
    document.getElementById('msgChatInput').style.display='flex';
    document.getElementById('msgChatName').textContent=getUserName(otherUid);

    const updates={};
    updates['conversations/'+convoId+'/lastRead/'+MY_UID]=Date.now();
    updates['conversations/'+convoId+'/unreadCount/'+MY_UID]=0;
    rtdb.ref().update(updates);

    renderConvoList();

    if(convoListeners[convoId])rtdb.ref('messages/'+convoId).off('value',convoListeners[convoId]);

    convoListeners[convoId]=rtdb.ref('messages/'+convoId).orderByChild('timestamp').on('value',snap=>{
      const body=document.getElementById('msgChatBody');
      body.innerHTML='';
      if(!snap.exists()){
        body.innerHTML=`<div style="text-align:center;padding:30px;color:var(--muted);font-size:.8rem">No messages yet. Say hi!</div>`;
        return;
      }
      snap.forEach(child=>{
        const m=child.val();
        const bubble=document.createElement('div');
        bubble.className='msg-bubble '+(m.senderUid===MY_UID?'sent':'received');
        bubble.innerHTML=`${escapeHTML(m.text)}<div class="msg-ts">${m.timestamp?timeAgo(m.timestamp):''}</div>`;
        body.appendChild(bubble);
      });
      body.scrollTop=body.scrollHeight;
      if(activeConvoId===convoId){
        rtdb.ref('conversations/'+convoId+'/unreadCount/'+MY_UID).set(0);
        rtdb.ref('conversations/'+convoId+'/lastRead/'+MY_UID).set(Date.now());
      }
    });
  }

  // ══════ SEND MESSAGE ══════
  async function sendMessage(){
    const input=document.getElementById('msgInput');
    const text=input.value.trim();
    if(!text||!activeConvoId)return;
    input.value='';

    const convo=convosData[activeConvoId];
    if(!convo){toast('Conversation not found');return;}
    const otherUid=Object.keys(convo.participants||{}).find(uid=>uid!==MY_UID);
    if(!otherUid){toast('Cannot find recipient');return;}

    try{
      await rtdb.ref('messages/'+activeConvoId).push({
        senderUid:MY_UID,
        text:text,
        timestamp:firebase.database.ServerValue.TIMESTAMP
      });
      const updates={};
      updates['conversations/'+activeConvoId+'/lastMessage']=text;
      updates['conversations/'+activeConvoId+'/lastMessageTs']=firebase.database.ServerValue.TIMESTAMP;
      updates['conversations/'+activeConvoId+'/lastRead/'+MY_UID]=Date.now();
      await rtdb.ref().update(updates);
      rtdb.ref('conversations/'+activeConvoId+'/unreadCount/'+otherUid).transaction(val=>(val||0)+1);
    }catch(e){
      toast('Failed to send: '+e.message);
    }
  }

  document.getElementById('msgSendBtn').addEventListener('click',sendMessage);
  document.getElementById('msgInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendMessage();});

  function renderNewConvoResults(){
    const c=document.getElementById('newConvoResults');c.innerHTML='';
    const q=(document.getElementById('newConvoSearch').value||'').toLowerCase();
    Object.keys(allUsersCache).filter(uid=>uid!==MY_UID).forEach(uid=>{
      const name=getUserName(uid);
      if(q&&!name.toLowerCase().includes(q))return;
      const av=getUserAvatar(uid);
      const item=document.createElement('div');item.className='new-convo-user';
      item.innerHTML=`
        <div class="ncu-av">${av?`<img src="${av}" alt=""/>`:name[0].toUpperCase()}</div>
        <div class="ncu-name">${name}</div>
      `;
      item.addEventListener('click',()=>startConvo(uid));
      c.appendChild(item);
    });
    if(!c.children.length){
      c.innerHTML=`<div style="text-align:center;padding:20px;color:var(--muted);font-size:.8rem">No users found</div>`;
    }
  }

  async function startConvo(otherUid){
    document.getElementById('newConvoOverlay').classList.remove('open');
    let existingId=null;
    Object.entries(convosData).forEach(([id,convo])=>{
      if(convo.participants&&convo.participants[otherUid])existingId=id;
    });
    if(existingId){openConvo(existingId,otherUid);return;}
    try{
      const convoRef=rtdb.ref('conversations').push();
      await convoRef.set({
        participants:{[MY_UID]:true,[otherUid]:true},
        lastMessage:'',
        lastMessageTs:firebase.database.ServerValue.TIMESTAMP,
        lastRead:{[MY_UID]:Date.now(),[otherUid]:0},
        unreadCount:{[MY_UID]:0,[otherUid]:0}
      });
      setTimeout(()=>openConvo(convoRef.key,otherUid),500);
    }catch(e){
      toast('Failed to create conversation: '+e.message);
    }
  }

  document.getElementById('msgSearchInput').addEventListener('input',renderConvoList);

  document.getElementById('msgChatBack').addEventListener('click',()=>{
    document.getElementById('messagesPanel').classList.remove('msg-panel-mobile-full');
    activeConvoId=null;
    document.getElementById('msgEmpty').style.display='flex';
    document.getElementById('msgChatHeader').style.display='none';
    document.getElementById('msgChatBody').style.display='none';
    document.getElementById('msgChatInput').style.display='none';
  });

  /* ══════════════════════════════════════════
     USER PROFILE OVERLAY
  ══════════════════════════════════════════ */
  function openProfile(uid){

    const avatarInner=pAvatar?`<img src="${pAvatar}" alt=""/>`:pName[0].toUpperCase();

      <div class="profile-banner" id="profileBannerWrap">

          </div>

        <div class="profile-bio">${escapeHTML(data.bio||'No bio yet.')}</div>
        <div class="profile-stats-row">
          <div class="profile-stat"><div class="profile-stat-num" id="profPostCount">0</div><div class="profile-stat-label">Posts</div></div>
          <div class="profile-stat"><div class="profile-stat-num">${followers}</div><div class="profile-stat-label">Followers</div></div>
          <div class="profile-stat"><div class="profile-stat-num">${following}</div><div class="profile-stat-label">Following</div></div>
        </div>
        ${!isMe?`
        <div class="profile-actions-row">
          <button class="profile-btn profile-btn-primary" id="profFollowBtn">${fol?'Following':'Follow'}</button>
          <button class="profile-btn profile-btn-secondary" id="profMsgBtn">Message</button>
         <button class="profile-btn profile-btn-danger" id="profReportBtn">${ICONS.flag} Report</button>

      </div>

          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>

    overlay.classList.add('open');

    const msgBtn=panel.querySelector('#profMsgBtn');

    if(repBtn)repBtn.addEventListener('click',()=>{

      rtdb.ref('posts').orderByChild('authorUid').equalTo(uid).once('value',snap=>{

        </div>

  /* ════════════════���═════════════════════════
     PROFILE BANNER RENDERER
  ══════════════════════════════════════════ */
  function renderProfileBanner(data){
    requestAnimationFrame(()=>{requestAnimationFrame(()=>{
      const canvas=document.getElementById('profileBannerCanvas');
      if(!canvas)return;
      const ctx=canvas.getContext('2d');
      const wrap=document.getElementById('profileBannerWrap');
      if(!wrap)return;
      const dpr=Math.min(devicePixelRatio||1,2);
      const w=wrap.offsetWidth;
      const h=280;
      if(w===0)return;

      canvas.width=w*dpr;canvas.height=h*dpr;
      canvas.style.width=w+'px';canvas.style.height=h+'px';
      ctx.setTransform(dpr,0,0,dpr,0,0);

      let bd={bg:'#0a0a1a',items:[],pattern:'none',particles:'none',border:'none'};
      if(data.banner){
        try{
          bd=typeof data.banner==='string'?JSON.parse(data.banner):data.banner;
          bd.items=bd.items||[];bd.pattern=bd.pattern||'none';bd.particles=bd.particles||'none';bd.border=bd.border||'none';
        }catch(e){}
      }

      const bg=bd.bg||'#0a0a1a';
      if(bg.startsWith('linear-gradient')){
        const cols=bg.match(/#[0-9a-fA-F]{3,8}/g)||['#0a0a1a','#1a1a2e'];
        const g=ctx.createLinearGradient(0,0,w,h);
        cols.forEach((c,i)=>g.addColorStop(i/(cols.length-1||1),c));
        ctx.fillStyle=g;
      }else if(bg==='anim-rainbow'){
        const t=Date.now()*.001,g=ctx.createLinearGradient(0,0,w,0);
        for(let i=0;i<=6;i++)g.addColorStop(i/6,`hsl(${(t*40+i*60)%360},65%,35%)`);
        ctx.fillStyle=g;
      }else if(bg==='anim-matrix'){ctx.fillStyle='#000a00';}
      else if(bg==='anim-blackhole'){
        const t=Date.now()*.001,g=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
        g.addColorStop(0,'#000');g.addColorStop(.5,`hsl(${t*20%360},50%,8%)`);g.addColorStop(1,'#000');
        ctx.fillStyle=g;
      }else{ctx.fillStyle=bg;}
      ctx.fillRect(0,0,w,h);

      if(bd.pattern&&bd.pattern!=='none'){
        ctx.save();ctx.globalAlpha=.08;ctx.strokeStyle='#fff';ctx.fillStyle='#fff';ctx.lineWidth=.5;
        if(bd.pattern==='dots'){for(let x=0;x<w;x+=12)for(let y=0;y<h;y+=12){ctx.beginPath();ctx.arc(x,y,1,0,Math.PI*2);ctx.fill();}}
        else if(bd.pattern==='grid'){for(let x=0;x<w;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke();}for(let y=0;y<h;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}}
        else if(bd.pattern==='diagonal'){for(let i=-h;i<w+h;i+=15){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i-h,h);ctx.stroke();}}
        else if(bd.pattern==='starfield'){for(let i=0;i<40;i++){const x2=(i*71)%w,y2=(i*47)%h;ctx.beginPath();ctx.arc(x2,y2,.5+((i*13)%3)*.5,0,Math.PI*2);ctx.fill();}}
        else if(bd.pattern==='diamonds'){for(let x2=0;x2<w;x2+=24)for(let y2=0;y2<h;y2+=24){ctx.beginPath();ctx.moveTo(x2,y2-8);ctx.lineTo(x2+8,y2);ctx.lineTo(x2,y2+8);ctx.lineTo(x2-8,y2);ctx.closePath();ctx.stroke();}}
        ctx.restore();
      }

      if(bd.border&&bd.border!=='none'){
        const b=bd.border;
        if(b==='rainbow')ctx.strokeStyle=`hsl(${Date.now()*.06%360},70%,55%)`;
        else if(b==='pulse'){const a=.4+Math.sin(Date.now()*.003)*.3;ctx.strokeStyle=`rgba(139,92,246,${a})`;}
        else ctx.strokeStyle=b;
        ctx.lineWidth=3;ctx.strokeRect(1.5,1.5,w-3,h-3);
      }

      const fn=getComputedStyle(document.body).fontFamily;
      (bd.items||[]).forEach(it=>{
        const ix=it.x*w,iy=it.y*h,sz=it.size||16,col=it.color||'#fff',alpha=(it.opacity||100)/100,rot=(it.rotation||0)*Math.PI/180;
        ctx.save();ctx.translate(ix,iy);if(rot)ctx.rotate(rot);ctx.globalAlpha=alpha;

        if(it.kind==='sticker'||it.kind==='badge'){
          ctx.font=sz+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(it.val,0,0);
        }else if(it.kind==='text'||it.kind==='name'){
          ctx.font=(it.bold?'800 ':'500 ')+sz+'px '+fn;ctx.textAlign='center';ctx.textBaseline='middle';
          if(col.startsWith&&col.startsWith('grad-')){
            const cs=col==='grad-cyan-purple'?['#22d3ee','#8b5cf6']:['#f59e0b','#ef4444'];
            const lg=ctx.createLinearGradient(-sz*2,0,sz*2,0);lg.addColorStop(0,cs[0]);lg.addColorStop(1,cs[1]);ctx.fillStyle=lg;
          }else{ctx.fillStyle=col;}
          if(it.glow){ctx.shadowColor=(col.startsWith&&col.startsWith('grad'))?'#8b5cf6':col;ctx.shadowBlur=it.glow;}
          ctx.fillText(it.val||'Text',0,0);ctx.shadowBlur=0;
        }else if(it.kind==='stat'){
          ctx.font='900 '+sz+'px '+fn;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=col;
          ctx.fillText((data.credits||0).toLocaleString(),0,0);
          if(it.label){ctx.font='600 7px '+fn;ctx.globalAlpha=alpha*.5;ctx.fillStyle='#fff';ctx.fillText(it.label,0,sz/2+8);}
        }else if(it.kind==='credits'){
          ctx.font='900 '+sz+'px '+fn;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#f59e0b';
          ctx.fillText((data.credits||0).toLocaleString(),0,0);
        }else if(it.kind==='icon'){
          ctx.fillStyle=col;ctx.font='bold '+sz+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
          const syms={shield:'\u25C6',sword:'\u2694',coin:'\u25CB',skull:'\u2620',star6:'\u2736',crosshair:'\u25CE',bolt:'\u26A1',crown:'\u265B',eye:'\u25C9',infinity:'\u221E',diamond:'\u25C7',wings:'\u2764'};
          ctx.fillText(syms[it.val]||'\u25C6',0,0);
        }else if(it.kind==='shape'){
          ctx.fillStyle=col;ctx.strokeStyle=col;ctx.lineWidth=2;const s=sz/2;
          if(it.val==='circle'){ctx.beginPath();ctx.arc(0,0,s,0,Math.PI*2);ctx.fill();}
          else if(it.val==='square'){ctx.fillRect(-s,-s,sz,sz);}
          else if(it.val==='triangle'){ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s,s);ctx.lineTo(-s,s);ctx.closePath();ctx.fill();}
          else if(it.val==='hexagon'){ctx.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3-Math.PI/2;ctx.lineTo(s*Math.cos(a),s*Math.sin(a));}ctx.closePath();ctx.fill();}
          else if(it.val==='ring'){ctx.beginPath();ctx.arc(0,0,s,0,Math.PI*2);ctx.stroke();}
          else if(it.val==='glow_orb'){const gg=ctx.createRadialGradient(0,0,0,0,0,s);gg.addColorStop(0,col);gg.addColorStop(1,'transparent');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(0,0,s,0,Math.PI*2);ctx.fill();}
        }
        ctx.restore();
      });
    });});
  }

  /* ══════════════════════════════════════════
     SETTINGS
  ══════════════════════════════════════════ */
  function openSettings(){document.getElementById('settingsOverlay').classList.add('open');}

  document.getElementById('settingsClose').addEventListener('click',()=>document.getElementById('settingsOverlay').classList.remove('open'));
  document.getElementById('settingsOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open');});

  document.getElementById('settingsSaveBtn').addEventListener('click',async()=>{
    const updates={};
    updates['users/'+MY_UID+'/privateProfile']=document.getElementById('settingPrivate').checked;
    updates['users/'+MY_UID+'/bio']=document.getElementById('settingBio').value.trim();
    const nick=document.getElementById('settingNickname').value.trim();
    if(nick)updates['users/'+MY_UID+'/nickname']=nick;
    try{
      await rtdb.ref().update(updates);
      toast('Settings saved!','success');
      document.getElementById('settingsOverlay').classList.remove('open');
    }catch(e){toast('Failed: '+e.message);}
  });

  /* ══════════════════════════════════════════
     REPORT SYSTEM
  ══════════════════════════════════════════ */
  function openReport(){
    selectedReason=null;
    document.getElementById('reportOverlay').classList.add('open');
    document.querySelectorAll('.report-option').forEach(o=>o.classList.remove('selected'));
    document.getElementById('reportSubmit').disabled=true;
  }

  document.getElementById('reportCancel').addEventListener('click',()=>document.getElementById('reportOverlay').classList.remove('open'));
  document.getElementById('reportOverlay').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open');});

  document.querySelectorAll('.report-option').forEach(opt=>{
    opt.addEventListener('click',()=>{
      document.querySelectorAll('.report-option').forEach(o=>o.classList.remove('selected'));
      opt.classList.add('selected');
      selectedReason=opt.dataset.reason;
      document.getElementById('reportSubmit').disabled=false;
    });
  });

  document.getElementById('reportSubmit').addEventListener('click',async()=>{
    if(!selectedReason||!reportTarget)return;
    try{
      const reportData={
        reporterUid:MY_UID,
        targetType:reportTarget.type,
        targetId:reportTarget.id,
        reason:selectedReason,
        timestamp:firebase.database.ServerValue.TIMESTAMP
      };
      if(reportTarget.authorUid)reportData.targetAuthorUid=reportTarget.authorUid;
      if(reportTarget.postId)reportData.postId=reportTarget.postId;
      await rtdb.ref('reports').push(reportData);
      toast('Report submitted. Thank you.','success');
      document.getElementById('reportOverlay').classList.remove('open');
      reportTarget=null;selectedReason=null;
    }catch(e){toast('Failed: '+e.message);}
  });

  /* ══════════════════════════════════════════
     NAV COMMON
  ══════════════════════════════════════════ */
  (()=>{const n=document.getElementById('navbar');let t=false;window.addEventListener('scroll',()=>{if(!t){requestAnimationFrame(()=>{n.classList.toggle('scrolled',scrollY>20);t=false;});t=true;}});})();
  (()=>{const h=document.getElementById('hamburger'),m=document.getElementById('mobileMenu');h.addEventListener('click',()=>{h.classList.toggle('open');m.classList.toggle('open');});m.querySelectorAll('.nav-link').forEach(l=>l.addEventListener('click',()=>{h.classList.remove('open');m.classList.remove('open');}));})();
  document.getElementById('navAvatar').addEventListener('click',()=>location.href='profile.html');

  /* ══════════════════════════════════════════
     PARTICLE SYSTEM
  ══════════════════════════════════════════ */
  (()=>{const c=document.getElementById('particles'),x=c.getContext('2d');let W,H,p=[];const N=Math.min(40,Math.round(innerWidth*.03)),C=['rgba(139,92,246,','rgba(6,182,212,','rgba(236,72,153,'];function rs(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(d,0,0,d,0,0);}function mk(){return{x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.4,vx:(Math.random()-.5)*.2,vy:(Math.random()-.5)*.2,a:Math.random()*.3+.1,c:C[Math.random()*3|0]};}function init(){rs();p=[];for(let i=0;i<N;i++)p.push(mk());}function draw(){x.clearRect(0,0,W,H);for(let i=0;i<p.length;i++){const q=p[i];q.x+=q.vx;q.y+=q.vy;q.vx*=.99;q.vy*=.99;if(q.x<-10)q.x=W+10;if(q.x>W+10)q.x=-10;if(q.y<-10)q.y=H+10;if(q.y>H+10)q.y=-10;x.beginPath();x.arc(q.x,q.y,q.r,0,Math.PI*2);x.fillStyle=q.c+q.a+')';x.fill();for(let j=i+1;j<p.length;j++){const r=p[j],ld=(q.x-r.x)**2+(q.y-r.y)**2;if(ld<14000){x.beginPath();x.moveTo(q.x,q.y);x.lineTo(r.x,r.y);x.strokeStyle=q.c+(0.05*(1-ld/14000))+')';x.lineWidth=.4;x.stroke();}}}requestAnimationFrame(draw);}addEventListener('resize',rs);init();draw();})();

  /* ══════════════════════════════════════════
     THEME
  ══════════════════════════════════════════ */
  (()=>{const KEY='aightbet-theme';function apply(t){document.documentElement.setAttribute('data-theme',t);localStorage.setItem(KEY,t);}apply(localStorage.getItem(KEY)||'dark');window.AightBetTheme={get:()=>localStorage.getItem(KEY)||'dark',set:apply,toggle:()=>apply(localStorage.getItem(KEY)==='dark'?'light':'dark')};})();
  </script>
