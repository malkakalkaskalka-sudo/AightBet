    function wireModActionHandlers(uid){
      const banBtn = document.getElementById('doBanBtn');
      if(banBtn) banBtn.addEventListener('click', ()=> doBanUser(uid));
      const unbanBtn = document.getElementById('doUnbanBtn');
      if(unbanBtn) unbanBtn.addEventListener('click', ()=> doUnbanUser(uid));
      const warnBtn = document.getElementById('doWarnBtn');
      if(warnBtn) warnBtn.addEventListener('click', ()=> doWarnUser(uid));
      const kickBtn = document.getElementById('doKickBtn');
      if(kickBtn) kickBtn.addEventListener('click', ()=> doForceLogout(uid));
      const tmBtn = document.getElementById('doTmBtn');
      if(tmBtn) tmBtn.addEventListener('click', ()=> doSendTargetedFromModal(uid));
    }

    async function doBanUser(uid){
      const durMs = parseInt(document.getElementById('banDurSel').value);
      const reason = document.getElementById('banReasonInp').value.trim();
      if(!reason){ toast('Reason is required'); return; }
      const expiresAt = durMs>0 ? Date.now()+durMs : 0;
      const who = modBy();
      try{
        const updates = {};
        updates['users/'+uid+'/banned'] = true;
        updates['users/'+uid+'/banReason'] = reason;
        updates['users/'+uid+'/bannedAt'] = Date.now();
        updates['users/'+uid+'/banExpiresAt'] = expiresAt;
        await rtdb.ref().update(updates);
        const banRef = rtdb.ref('moderation/'+uid+'/bans').push();
        await banRef.set({
          id: banRef.key, reason, active:true,
          at: firebase.database.ServerValue.TIMESTAMP,
          expiresAt: expiresAt, by: who.by, byName: who.byName
        });
        await logModAction(expiresAt>0?'temp_ban':'perm_ban', uid, { reason, expiresAt });
        toast(expiresAt>0?('Temp-banned for '+fmtDuration(durMs)):'Permanently banned','success');
        renderModerationModal();
      }catch(e){ toast('Error: '+e.message); }
    }

    async function doUnbanUser(uid){
      if(!confirm('Lift the ban for '+getUserName(uid)+'?')) return;
      const who = modBy();
      try{
        const updates = {};
        updates['users/'+uid+'/banned'] = null;
        updates['users/'+uid+'/banReason'] = null;
        updates['users/'+uid+'/bannedAt'] = null;
        updates['users/'+uid+'/banExpiresAt'] = null;
        await rtdb.ref().update(updates);
        const bansSnap = await rtdb.ref('moderation/'+uid+'/bans').once('value');
        const bans = bansSnap.val() || {};
        const upd2 = {};
        Object.entries(bans).forEach(([bid,b])=>{
          if(b.active){
            upd2['moderation/'+uid+'/bans/'+bid+'/active'] = false;
            upd2['moderation/'+uid+'/bans/'+bid+'/liftedAt'] = Date.now();
            upd2['moderation/'+uid+'/bans/'+bid+'/liftedBy'] = who.by;
            upd2['moderation/'+uid+'/bans/'+bid+'/liftedByName'] = who.byName;
          }
        });
        if(Object.keys(upd2).length) await rtdb.ref().update(upd2);
        await logModAction('unban', uid, null);
        toast('Ban lifted','success');
        renderModerationModal();
      }catch(e){ toast('Error: '+e.message); }
    }

    async function doWarnUser(uid){
      const reason = document.getElementById('warnReasonInp').value.trim();
      if(!reason){ toast('Warning reason is required'); return; }
      const who = modBy();
      try{
        const wr = rtdb.ref('moderation/'+uid+'/warnings').push();
        await wr.set({
          id: wr.key, reason, at: firebase.database.ServerValue.TIMESTAMP,
          by: who.by, byName: who.byName, seen:false, cleared:false
        });
        const current = getWarningCount(uid) + 1;
        await rtdb.ref('users/'+uid+'/warningCount').set(current);
        await logModAction('warn', uid, { reason });
        toast('Warning issued','success');
        document.getElementById('warnReasonInp').value='';
        renderModerationModal();
      }catch(e){ toast('Error: '+e.message); }
    }

    window.clearWarning = async function(uid, wid){
      if(!confirm('Clear this warning?')) return;
      try{
        await rtdb.ref('moderation/'+uid+'/warnings/'+wid+'/cleared').set(true);
        await rtdb.ref('moderation/'+uid+'/warnings/'+wid+'/clearedAt').set(Date.now());
        const snap = await rtdb.ref('moderation/'+uid+'/warnings').once('value');
        const ws = snap.val()||{};
        let active=0; for(const k in ws){ if(ws[k]&&!ws[k].cleared) active++; }
        await rtdb.ref('users/'+uid+'/warningCount').set(active);
        await logModAction('clear_warning', uid, { warningId: wid });
        toast('Warning cleared','success');
        renderModerationModal();
      }catch(e){ toast('Error: '+e.message); }
    };

    async function doForceLogout(uid){
      if(!confirm('Force logout all active sessions for '+getUserName(uid)+'?\nThey will be redirected to index.html.')) return;
      const reasonEl = document.getElementById('kickReasonInp');
      const reason = reasonEl ? reasonEl.value.trim() : '';
      const who = modBy();
      const now = Date.now();
      try{
        await rtdb.ref('users/'+uid+'/forceLogoutAt').set(now);
        const flRef = rtdb.ref('moderation/'+uid+'/forceLogouts').push();
        await flRef.set({ at: now, by: who.by, byName: who.byName, reason: reason||null });
        await logModAction('force_logout', uid, { reason: reason||null });
        toast('Force logout triggered','success');
        renderModerationModal();
      }catch(e){ toast('Error: '+e.message); }
    }

    async function doSendTargetedFromModal(uid){
      const el = document.getElementById('tmMsgInp');
      const text = el ? el.value.trim() : '';
      if(!text){ toast('Write a message first'); return; }
      const who = modBy();
      try{
        const r = rtdb.ref('targetedMessages/'+uid).push();
        await r.set({
          id: r.key, text, at: firebase.database.ServerValue.TIMESTAMP,
          by: who.by, byName: who.byName, seen:false
        });
        await logModAction('targeted_message', uid, { textPreview: text.substring(0,60) });
        toast('Message queued — user will see it on next page load','success');
        el.value='';
        renderModerationModal();
      }catch(e){ toast('Error: '+e.message); }
    }

    window.deleteTargetedMsg = async function(uid, mid){
      if(!confirm('Delete this message?')) return;
      try{ await rtdb.ref('targetedMessages/'+uid+'/'+mid).remove(); toast('Deleted','success'); renderModerationModal(); }
      catch(e){ toast('Error: '+e.message); }
    };

    /* ══════════════════════ HISTORY TAB ══════════════════════ */
    function renderHistory(c){
      const filter = window.__histFilter || 'all';
      const q = (window.__histSearch||'').toLowerCase();

      const logs = Object.entries(allModerationLog).map(([id,l])=>({id, kind:'action', ...l}));

      const loginRows = [];
      Object.entries(allModeration).forEach(([uid, mod])=>{
        const lg = (mod && mod.loginLog) || {};
        Object.entries(lg).forEach(([lid, l])=>{
          loginRows.push({ id:lid, kind:'login', uid, at:l.at, ua:l.ua, page:l.page, session:l.session });
        });
      });

      let feed;
      if(filter==='logins') feed = loginRows;
      else if(filter==='all') feed = logs.concat(loginRows);
      else feed = logs.filter(l=>l.action===filter);

      if(q){
        feed = feed.filter(e=>{
          const nm = e.uid ? (getUserName(e.uid)||'').toLowerCase() : '';
          const bynm = (e.byName||'').toLowerCase();
          const det = JSON.stringify(e.details||{}).toLowerCase();
          return nm.includes(q) || bynm.includes(q) || det.includes(q) || (e.uid||'').toLowerCase().includes(q);
        });
      }
      feed.sort((a,b)=>(b.at||0)-(a.at||0));
      feed = feed.slice(0, 400);

      let h = `
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
          <select class="mm-select" id="histFilter" style="width:auto;min-width:180px">
            <option value="all">All activity</option>
            <option value="logins">Logins only</option>
            <option value="warn">Warnings</option>
            <option value="clear_warning">Warning cleared</option>
            <option value="temp_ban">Temp bans</option>
            <option value="perm_ban">Permanent bans</option>
            <option value="unban">Unbans</option>
            <option value="auto_unban_expired">Auto unbans (expired)</option>
            <option value="force_logout">Force logouts</option>
            <option value="targeted_message">Targeted messages</option>
          </select>
          <input class="mm-input" id="histSearch" placeholder="Filter by user, moderator, or text..." style="flex:1;min-width:220px" value="${escapeAttr(window.__histSearch||'')}"/>
        </div>
        <div style="font-size:.72rem;color:var(--muted);margin-bottom:8px">${feed.length} entr${feed.length===1?'y':'ies'}</div>
      `;

      if(!feed.length){
        h += `<div class="empty-state"><div class="es-title">No history yet</div><div style="font-size:.8rem">Actions taken by support will appear here.</div></div>`;
      } else {
        feed.forEach(e=>{
          const targetNm = e.uid ? getUserName(e.uid) : '—';

    const M_MAX_AUDIO = 9*1024*1024, M_MAX_COVER = 500*1024, M_MAX_DUR = 300;
   let mAudioFile = null;
let mAudioDur = 0;
let mCoverData = null;
let mAuthorImg = null;
let mPlCover = null;
let mEditImg = null;

    function mFmt(s){ if(!s||isNaN(s))return'—'; const m=Math.floor(s/60),r=Math.floor(s%60); return m+':'+String(r).padStart(2,'0'); }
    function mReadImage(file, cb){ if(file.size>M_MAX_COVER){toast('Image too big (max 500 KB)');return;} const r=new FileReader(); r.onload=()=>cb(r.result); r.readAsDataURL(file); }
   function mReadAudio(file, cb){
  if(file.size > M_MAX_AUDIO){
    toast('Audio too big (max 9 MB)');
    return;
  }

  const url = URL.createObjectURL(file);
  const probe = new Audio();
  probe.preload = 'metadata';
  probe.src = url;

  probe.addEventListener('loadedmetadata', () => {
    URL.revokeObjectURL(url);

    if(probe.duration > M_MAX_DUR + 0.5){
      toast('Track longer than 5 minutes');
      return;
    }

    cb(file, Math.round(probe.duration), file.name);
  });

  probe.addEventListener('error', () => {
    URL.revokeObjectURL(url);
    toast('Could not read audio file');
  });
}

window.mPickAudio = function(input){
  const f = input.files[0];
  if(!f) return;

  mReadAudio(f, (file, dur, name) => {
    mAudioFile = file;
    mAudioDur = dur;

    const t = document.getElementById('mAudioLabel');
    if(t) t.textContent = name + ' · ' + mFmt(dur);
  });
};

window.mPickCover=function(input){ const f=input.files[0]; if(!f)return; mReadImage(f,d=>{ mCoverData=d; const t=document.getElementById('mCoverLabel'); if(t)t.innerHTML='<img src="'+d+'" style="width:38px;height:38px;border-radius:7px;object-fit:cover"/>'; }); };

window.mMigrateSongsToStorage = async function(){

  if(!confirm(
    'Migrate all old music from Realtime Database to Firebase Storage?'
  )){
    return;
  }

  try{

    const snap = await rtdb.ref('songs').once('value');
    const songs = snap.val() || {};

    const ids = Object.keys(songs);

    if(!ids.length){
      toast('No songs found');
      return;
    }

    let migrated = 0;
    let skipped = 0;
    let failed = 0;

    for(const id of ids){

      const song = songs[id] || {};

      // Already migrated
      if(song.audioUrl){
        skipped++;
        continue;
      }

      let oldAudio = song.audio || null;

      // Old audio stored under songAudio/{id}
      if(!oldAudio){
        const audioSnap =
          await rtdb.ref('songAudio/' + id).once('value');

        oldAudio = audioSnap.val();
      }

      if(!oldAudio){
        console.warn('No audio found for:', id);
        skipped++;
        continue;
      }

      try{

        // Convert old Base64/data URL into a Blob
        const response = await fetch(oldAudio);
        const blob = await response.blob();

        // Upload to Firebase Storage
        const audioRef =
          storage.ref('songs/audio/' + id);

        await audioRef.put(blob, {
          contentType: blob.type || 'audio/mpeg'
        });

        // Get Storage download URL
        const audioUrl =
          await audioRef.getDownloadURL();

        // Save Storage URL in RTDB
        await rtdb.ref('songs/' + id).update({
          audioUrl: audioUrl
        });

        // ONLY delete old audio after successful upload
        await rtdb.ref('songAudio/' + id).remove();

        // Remove legacy inline audio if present
        if(song.audio){
          await rtdb.ref('songs/' + id + '/audio').remove();
        }

        migrated++;

        console.log('Migrated:', id);

      }catch(err){

        failed++;

        console.error(
          'Failed to migrate ' + id,
          err
        );

      }
    }

    toast(
      `Migration complete: ${migrated} migrated, ${skipped} skipped, ${failed} failed.`,
      failed ? 'error' : 'success',
      7000
    );

  }catch(err){

    console.error(err);

    toast(
      'Migration failed: ' + (err.message || '').slice(0,100),
      'error',
      7000
    );

  }
};

    window.handleSongRequest = async function(id, status){
      try{
        await rtdb.ref('songRequests/'+id+'/status').set(status);
        // Notify the user
        const r = allSongRequests[id];
        if(r && r.requestedBy){
          await rtdb.ref('users/'+r.requestedBy+'/notifications').push({
            type:'songRequest', status, title: r.title||'Your song request',
            message: status==='accepted'?`"${r.title}" has been added to Aightbet FM!`:`Your request for "${r.title}" was declined.`,
            at: Date.now(), read: false
          });
        }
        toast(status==='accepted'?'Marked as added!':status==='denied'?'Request declined':'Reopened','success');
      }catch(e){ toast('Error: '+e.message); }
    };

    window.deleteSongRequest = async function(id){
      if(!confirm('Delete this song request?')) return;
      try{ await rtdb.ref('songRequests/'+id).remove(); toast('Deleted','success'); }

    /* ── Song actions ── */
   window.mAddSong = async function(){

  const title = document.getElementById('mSongTitle').value.trim();

  if(!mAudioFile){
    toast('Choose an audio file');
    return;
  }

  if(!title){
    toast('Enter a song name');
    return;
  }

  const authorId = document.getElementById('mSongAuthor').value || null;
  const author = authorId ? allAuthors[authorId] : null;

  try{

    // Create song ID first
    const ref = rtdb.ref('songs').push();
    const songId = ref.key;

    // Upload audio to Firebase Storage
    const audioRef = storage.ref('songs/audio/' + songId);

    const uploadSnap = await audioRef.put(mAudioFile, {
      contentType: mAudioFile.type || 'audio/mpeg'
    });

    // Get public/download URL
    const audioUrl = await uploadSnap.ref.getDownloadURL();

    // Cover can stay the way you currently handle it for now
    const cv = mCoverData || (author && author.image) || null;

    if(cv){
      await rtdb.ref('songCover/' + songId).set(cv);
    }

    // Store ONLY metadata in RTDB
    await ref.set({
      title,
      album: document.getElementById('mSongAlbum').value.trim() || 'Single',
      description: document.getElementById('mSongDesc').value.trim() || '',
      duration: mAudioDur,

      audioUrl: audioUrl,

      authorId,
      posterUid: auth.currentUser.uid,
      posterName: author ? author.name : 'Aightbet FM',
      posterAvatar: author ? (author.image || null) : null,

      cover: cv || null,

      createdAt: Date.now()
    });

    // Reset
    mAudioFile = null;
    mCoverData = null;
    mAudioDur = 0;

    const audioLabel = document.getElementById('mAudioLabel');
    if(audioLabel) audioLabel.textContent = 'Choose audio (max 5 min, 9 MB)';

    toast('Song published', 'success');

  }catch(e){

    console.error(e);
    toast('Error: ' + (e.message || '').slice(0,80));

  }
};
    window.mAssignSong=async function(id, authorId){

      try{
        const upd={ authorId: authorId||null };
        if(author){ upd.posterName=author.name; if(author.image) upd.posterAvatar=author.image; }
        await rtdb.ref('songs/'+id).update(upd);
        toast(authorId?'Assigned to artist':'Unassigned','success');
      }catch(e){toast('Error: '+e.message);}
    };
    window.mDeleteSong=async function(id){
      if(!confirm('Delete this song?'))return;
      try{ await rtdb.ref().update({['songs/'+id]:null,['songAudio/'+id]:null,['songCover/'+id]:null,['songLyrics/'+id]:null,['lyricRequests/'+id]:null,['lyricFixRequests/'+id]:null}); toast('Song deleted','success'); }
      catch(e){toast('Error: '+e.message);}
    };

    /* ── Playlist actions ── */
    window.mCreatePlaylist=async function(){
      const name=document.getElementById('mPlName').value.trim();
      if(!name){toast('Enter a playlist name');return;}
      try{
        await rtdb.ref('playlists').push({
          name, description:document.getElementById('mPlDesc').value.trim()||'', image:mPlCover||null,
          official:true, public:true, authorId:(document.getElementById('mPlAuthor')?document.getElementById('mPlAuthor').value||null:null), ownerUid:auth.currentUser.uid, ownerName:'Aightbet FM', songs:{}, createdAt:Date.now()
        });
        mPlCover=null; toast('Playlist created','success');
      }catch(e){toast('Error: '+e.message);}
    };
    window.mDeletePlaylist=async function(id){
      if(!confirm('Delete this playlist?'))return;
      try{ await rtdb.ref('playlists/'+id).remove(); toast('Playlist deleted','success'); }
      catch(e){toast('Error: '+e.message);}
    };
    window.mAssignPlaylist=async function(id, authorId){
      try{ await rtdb.ref('playlists/'+id+'/authorId').set(authorId||null); toast(authorId?'Set as album of artist':'Made standalone','success'); }
      catch(e){toast('Error: '+e.message);}
    };
    window.mManagePlaylist=function(id){
      const p=allPlaylists[id]||{}; const inPl=p.songs||{};
      const songs=Object.entries(allMusicSongs).map(([sid,s])=>({sid,...s})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      let body=`<h3>Manage: ${escapeHTML(p.name||'Playlist')}<button class="modal-close" onclick="document.getElementById('modalOverlay').classList.remove('open')"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></h3>
        <div style="font-size:.78rem;color:var(--muted);margin-bottom:10px">Tap a song to add or remove it from this playlist.</div>`;
      if(!songs.length){ body+=`<div class="mm-empty">No songs available.</div>`; }
      songs.forEach(s=>{
        const has=!!inPl[s.sid];
        const cov=s.cover?`<img src="${s.cover}" style="width:36px;height:36px;border-radius:6px;object-fit:cover"/>`:`<div style="width:36px;height:36px;border-radius:6px;background:linear-gradient(135deg,var(--accent),var(--accent2))"></div>`;
        body+=`<div class="user-row" style="cursor:pointer" onclick="mTogglePlaylistSong('${id}','${s.sid}')">${cov}<div class="user-info"><div class="user-name">${escapeHTML(s.title||'Untitled')}</div><div class="user-email">${escapeHTML(s.posterName||'Unknown')}</div></div>
          <button class="r-btn ${has?'delete':'approve'}">${has?'Remove':'Add'}</button></div>`;
      });
      document.getElementById('modalBox').innerHTML=body;
      document.getElementById('modalOverlay').classList.add('open');
    };
    window.mTogglePlaylistSong=async function(pid, sid){
      const p=allPlaylists[pid]||{}; const has=p.songs&&p.songs[sid];
      try{
        if(has){ await rtdb.ref('playlists/'+pid+'/songs/'+sid).remove(); }
        else { await rtdb.ref('playlists/'+pid+'/songs/'+sid).set(Date.now()); }
        if(!allPlaylists[pid].songs) allPlaylists[pid].songs={};
        if(has) delete allPlaylists[pid].songs[sid]; else allPlaylists[pid].songs[sid]=Date.now();
        mManagePlaylist(pid);
      }catch(e){toast('Error: '+e.message);}
    };

    /* ════════ LYRICS EDITOR ════════ */
    // lyricsEditorLines = [{time: seconds, text: string}, ...]
    let _lyricsEditorSongId = null;
    let _lyricsEditorLines = [];
    // An audio element for preview in the editor
    let _leAudio = null;

    function mFmtTime(s){ if(!s && s!==0) return''; const m=Math.floor(s/60),r=Math.floor(s%60),ms=Math.round((s%1)*100); return m+':'+String(r).padStart(2,'0')+'.'+String(ms).padStart(2,'0'); }
    function mParseTime(str){ if(!str) return null; const parts=str.trim().split(':'); if(parts.length===2){ const [min,sec]=parts; return parseFloat(min)*60+parseFloat(sec); } return parseFloat(str); }

    window.mEditLyrics = async function(songId, songTitle){
      _lyricsEditorSongId = songId;
      const existing = allSongLyrics[songId];
      _lyricsEditorLines = existing && existing.lines ? existing.lines.map(l=>({...l})) : [];
      const s = allMusicSongs[songId]||{};

      // Load audio for preview
      _leAudio = null;
      try{
        const snap = await rtdb.ref('songAudio/'+songId).once('value');
        const src = snap.val() || s.audio;
        if(src){ _leAudio = new Audio(); _leAudio.src = src; _leAudio.preload='auto'; }
      }catch(e){}

      renderLyricsEditor(songId, songTitle);
      document.getElementById('modalOverlay').classList.add('open');
    };

    function renderLyricsEditor(songId, songTitle){
      const box = document.getElementById('modalBox');
      const lines = _lyricsEditorLines;
      const hasDuration = _leAudio && _leAudio.duration > 0;

      box.innerHTML = `
        <h3 style="margin-bottom:10px">
          <svg viewBox="0 0 24 24" style="width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;vertical-align:middle;margin-right:6px"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Lyrics — ${escapeHTML(songTitle||'Untitled')}
          <button class="modal-close" onclick="if(_leAudio){_leAudio.pause();}document.getElementById('modalOverlay').classList.remove('open')"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </h3>

        <!-- Bulk import -->
        <details style="margin-bottom:12px">
          <summary style="font-size:.78rem;font-weight:700;color:var(--muted);cursor:pointer;padding:4px 0">Bulk import (paste plain text lyrics, one line per row)</summary>
          <textarea class="le-bulk-input" id="leBulkText" placeholder="Line 1&#10;Line 2&#10;Line 3&#10;..."></textarea>
          <button class="r-btn approve" style="margin-top:6px" onclick="leBulkImport()">Import Lines (timestamps start at 0:00)</button>
        </details>

        <!-- Audio controls -->
        <div style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:10px;margin-bottom:12px">
          <button class="r-btn view" id="lePlayBtn" onclick="leTogglePlay()" style="min-width:56px">▶ Play</button>
          <div style="flex:1">
            <input type="range" id="leSeek" min="0" max="100" value="0" style="width:100%;height:4px;cursor:pointer;accent-color:var(--accent)" oninput="leScrub(this.value)"/>
          </div>
          <span id="leTime" style="font-size:.72rem;color:var(--muted);font-family:monospace;min-width:50px;text-align:right">0:00</span>
          <button class="r-btn" onclick="leStampCurrentLine()" title="Stamp current time to next un-timed line" style="white-space:nowrap">⏱ Stamp</button>
        </div>

        <!-- Line editor -->
        <div style="font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);display:grid;grid-template-columns:90px 1fr auto;gap:8px;padding:0 10px;margin-bottom:6px">
          <span>Time (m:ss.cs)</span><span>Lyric line</span><span></span>
        </div>
        <div id="leLineList">
          ${lines.map((l,i)=>`
            <div class="le-line" id="le-line-${i}">
              <input class="le-time-input" id="le-t-${i}" value="${mFmtTime(l.time||0)}" placeholder="0:00.00" onchange="leUpdateLine(${i},'time',this.value)" onclick="leJumpTo(${i})"/>
              <input class="le-text-input" id="le-x-${i}" value="${escapeHTML(l.text||'')}" placeholder="Lyric line..." oninput="leUpdateLine(${i},'text',this.value)"/>
              <button class="le-rm" onclick="leRemoveLine(${i})">✕</button>
            </div>`).join('')}
        </div>
        <button class="le-add" onclick="leAddLine()">+ Add line</button>

        <!-- Save -->
        <div style="display:flex;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)">
          <button class="mm-btn purple" onclick="leSaveLyrics()">Save Lyrics</button>
          <button class="mm-btn red" onclick="mDeleteLyrics('${songId}');document.getElementById('modalOverlay').classList.remove('open')">Delete All</button>
        </div>
      `;

      // Wire up audio
      if(_leAudio){
        _leAudio.addEventListener('timeupdate', leTimeUpdate);
        _leAudio.addEventListener('ended', ()=>{ const b=document.getElementById('lePlayBtn'); if(b) b.textContent='▶ Play'; });
      }
    }

    function leTimeUpdate(){
      if(!_leAudio) return;
      const t = _leAudio.currentTime, d = _leAudio.duration||1;
      const el = document.getElementById('leTime');
      const sk = document.getElementById('leSeek');
      if(el) el.textContent = mFmtTime(t);
      if(sk) sk.value = (t/d)*100;
      // Highlight the active line
      _lyricsEditorLines.forEach((l,i)=>{
        const node = document.getElementById('le-line-'+i);
        if(!node) return;
        const next = _lyricsEditorLines[i+1];
        const active = t >= (l.time||0) && (!next || t < (next.time||0));
        node.style.borderColor = active ? 'var(--accent)' : '';
        node.style.background = active ? 'rgba(139,92,246,.1)' : '';
      });
    }

    window.leTogglePlay = function(){
      if(!_leAudio) return;
      const btn = document.getElementById('lePlayBtn');
      if(_leAudio.paused){ _leAudio.play().catch(()=>{}); if(btn) btn.textContent='⏸ Pause'; }
      else { _leAudio.pause(); if(btn) btn.textContent='▶ Play'; }
    };
    window.leScrub = function(val){
      if(!_leAudio||!_leAudio.duration) return;
      _leAudio.currentTime = (val/100)*_leAudio.duration;
    };
    window.leJumpTo = function(i){
      if(!_leAudio) return;
      const t = _lyricsEditorLines[i] && _lyricsEditorLines[i].time;
      if(t >= 0) _leAudio.currentTime = t;
    };
    window.leStampCurrentLine = function(){
      if(!_leAudio) return;
      const t = _leAudio.currentTime;
      // Find next line that has empty or 0 time after last stamped line
      let idx = -1;
      for(let i=0; i<_lyricsEditorLines.length; i++){
        if(!_lyricsEditorLines[i].time || _lyricsEditorLines[i].time === 0){
          // Also stamp if it's the next unset one
          if(idx === -1) idx = i;
          break;
        }
      }
      // Alternatively just stamp the line right after current audio position
      // Find last line whose time <= current
      let stampIdx = 0;
      for(let i=0; i<_lyricsEditorLines.length; i++){
        if((_lyricsEditorLines[i].time||0) <= t) stampIdx = i+1;
      }
      stampIdx = Math.min(stampIdx, _lyricsEditorLines.length-1);
      if(stampIdx < 0) return;
      _lyricsEditorLines[stampIdx].time = Math.round(t*100)/100;
      const inp = document.getElementById('le-t-'+stampIdx);
      if(inp) inp.value = mFmtTime(_lyricsEditorLines[stampIdx].time);
      toast('Stamped line '+(stampIdx+1)+' at '+mFmtTime(t),'success');
    };
    window.leUpdateLine = function(i, field, val){
      if(!_lyricsEditorLines[i]) return;
      if(field==='time'){ const t=mParseTime(val); if(t!==null&&!isNaN(t)) _lyricsEditorLines[i].time=Math.max(0,t); }
      else { _lyricsEditorLines[i].text = val; }
    };
    window.leAddLine = function(){
      const lastTime = _lyricsEditorLines.length ? (_lyricsEditorLines[_lyricsEditorLines.length-1].time||0)+3 : 0;
      _lyricsEditorLines.push({time: Math.round(lastTime*100)/100, text:''});
      const songId = _lyricsEditorSongId;
      const s = allMusicSongs[songId]||{};
      renderLyricsEditor(songId, s.title||'Untitled');
    };
    window.leRemoveLine = function(i){
      _lyricsEditorLines.splice(i,1);
      const songId = _lyricsEditorSongId;
      const s = allMusicSongs[songId]||{};
      renderLyricsEditor(songId, s.title||'Untitled');
    };
    window.leBulkImport = function(){
      const raw = (document.getElementById('leBulkText')||{}).value||'';
      const rows = raw.split('\n').map(l=>l.trim()).filter(Boolean);
      if(!rows.length){ toast('Paste some lines first'); return; }
      const interval = 3; // default 3 seconds between lines
      _lyricsEditorLines = rows.map((text,i)=>({time: Math.round(i*interval*100)/100, text}));
      const songId = _lyricsEditorSongId;
      const s = allMusicSongs[songId]||{};
      renderLyricsEditor(songId, s.title||'Untitled');
      toast('Imported '+rows.length+' lines — adjust timestamps as needed','success');
    };
    window.leSaveLyrics = async function(){
      if(!_lyricsEditorSongId){ toast('No song selected'); return; }
      // Collect current input values (user might not have fired onchange)
      const lines = _lyricsEditorLines.map((l,i)=>{
        const ti = document.getElementById('le-t-'+i);
        const xi = document.getElementById('le-x-'+i);
        const t = ti ? mParseTime(ti.value) : l.time;
        const x = xi ? xi.value : l.text;
        return { time: (!isNaN(t)&&t>=0)?Math.round(t*100)/100:0, text: x||'' };
      }).filter(l=>l.text.trim());
      lines.sort((a,b)=>a.time-b.time);
      try{
        await rtdb.ref('songLyrics/'+_lyricsEditorSongId).set({ lines, updatedAt: Date.now(), updatedBy: auth.currentUser.uid });
        // Mark lyric request as fulfilled if exists
        if(allLyricRequests[_lyricsEditorSongId]){
          await rtdb.ref('lyricRequests/'+_lyricsEditorSongId+'/status').set('fulfilled');
        }
        if(_leAudio){ _leAudio.pause(); }
        document.getElementById('modalOverlay').classList.remove('open');
        toast('Lyrics saved ('+lines.length+' lines)','success');
      }catch(e){ toast('Error saving lyrics: '+e.message); }
    };
    window.mDeleteLyrics = async function(songId){
      if(!confirm('Delete all lyrics for this song?')) return;
      try{ await rtdb.ref('songLyrics/'+songId).remove(); toast('Lyrics deleted','success'); }
      catch(e){ toast('Error: '+e.message); }
    };
    window.mDismissLyricReq = async function(songId){
      try{ await rtdb.ref('lyricRequests/'+songId+'/status').set('dismissed'); toast('Request dismissed','success'); }
      catch(e){ toast('Error: '+e.message); }
    };
    window.mResolveLyricFix = async function(songId, rid){
      try{ await rtdb.ref('lyricFixRequests/'+songId+'/'+rid+'/status').set('resolved');
        await rtdb.ref('lyricFixRequests/'+songId+'/'+rid+'/resolvedAt').set(Date.now());
        toast('Fix request resolved','success'); }
      catch(e){ toast('Error: '+e.message); }
    };
    window.mDismissLyricFix = async function(songId, rid){
      try{ await rtdb.ref('lyricFixRequests/'+songId+'/'+rid+'/status').set('dismissed');
        toast('Fix request dismissed','success'); }
      catch(e){ toast('Error: '+e.message); }
    };
    // Stop editor audio when modal closes
    document.getElementById('modalOverlay').addEventListener('click', e=>{
      if(e.target===document.getElementById('modalOverlay')&&_leAudio){ _leAudio.pause(); }
    });

  </script>
</body>
</html>
